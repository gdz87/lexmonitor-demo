<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fa3">
<meta name="description" content="Maqueta de plataforma de gestión de litigio contencioso administrativo (datos ficticios)">
<title>LexMonitor · Maqueta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="demo-banner" role="note">⚠ Maqueta con datos ficticios · no conectada a SAMAI ni a la Rama Judicial</div>
<header class="topbar">
  <button class="iconbtn sheet-trigger" id="btnMenu" aria-label="Más módulos">☰</button>
  <div class="brand"><span class="logo" aria-hidden="true">⚖</span><span id="appName">LexMonitor</span></div>
  <span class="sp"></span>
  <button class="iconbtn" id="btnAlerts" aria-label="Alertas">🔔<span class="badge hide" id="alertBadge">0</span></button>
  <button class="iconbtn" id="btnTheme" aria-label="Cambiar modo claro u oscuro">◐</button>
</header>
<div class="layout">
  <nav class="sidenav" id="sidenav" aria-label="Módulos"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Navegación principal"></nav>
<div class="sheet-backdrop" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Todos los módulos"><h2>Módulos</h2><div class="grid-links" id="sheetLinks"></div></div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<script src="js/lib.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/mod-core.js"></script>
<script src="js/mod-tools.js"></script>
<script src="js/mod-docs.js"></script>
<script>LM.boot();</script>
</body>
</html>
