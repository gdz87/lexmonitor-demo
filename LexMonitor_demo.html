<style>
:root{--bg:#f4f6fa;--surface:#fff;--surface2:#eef1f7;--text:#18202e;--muted:#5a6578;--border:#dde2ec;--primary:#1f4fa3;--primary-2:#2f6fe0;--on-primary:#fff;--ok:#1b7f4b;--warn:#a35d00;--danger:#b42318;--info:#1f6fb2;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);--r:14px;--nav-w:248px}

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}

.demo-banner{background:repeating-linear-gradient(45deg,#ffe9b0,#ffe9b0 12px,#fff3cf 12px,#fff3cf 24px);color:#5a3d00;text-align:center;font-size:.8rem;font-weight:600;padding:4px 8px;position:sticky;top:0;z-index:50}

.topbar{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:24px;z-index:40}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.05rem}.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#7a4bd8);display:grid;place-items:center;color:#fff;font-size:.95rem}
.topbar .sp{flex:1}
.iconbtn{min-width:44px;min-height:44px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;cursor:pointer;font-size:1.1rem;position:relative}

.layout{display:flex;min-height:calc(100vh - 92px)}
.sidenav{display:none}

.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;z-index:45;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav a,.sidenav a{text-decoration:none;color:var(--muted);display:flex;align-items:center;gap:.6rem}

.bottomnav a .ic,.sidenav a .ic{font-size:1.2rem}

.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;padding:1rem;z-index:61;transform:translateY(110%);transition:transform .2s,visibility .2s;max-height:80vh;overflow:auto;visibility:hidden}
.sheet.open{transform:none;visibility:visible}.sheet .grid-links{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.sheet .grid-links a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:.8rem .3rem;border-radius:12px;background:var(--surface2);text-decoration:none;color:var(--text);font-size:.8rem;text-align:center;min-height:72px;justify-content:center}
@media(min-width:1024px){.sidenav{display:block;width:var(--nav-w);background:var(--surface);border-right:1px solid var(--border);padding:1rem .6rem;position:sticky;top:92px;height:calc(100vh - 92px);overflow:auto;flex-shrink:0}
.sidenav a{padding:.6rem .8rem;border-radius:10px;min-height:44px;margin-bottom:2px}.sidenav a:hover{background:var(--surface2)}.sidenav a.active{background:color-mix(in srgb,var(--primary) 12%,transparent)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow);min-width:0}

@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}

.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}.btn.danger{color:var(--danger)}.btn.sm{min-height:36px;padding:.3rem .7rem;font-size:.82rem}

.timeline{position:relative;margin:1rem 0;padding-left:28px}.timeline:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:3px;background:var(--border);border-radius:3px}
.tl-item{position:relative;margin-bottom:.8rem;cursor:pointer}.tl-dot{position:absolute;left:-25px;top:12px;width:16px;height:16px;border-radius:50%;background:var(--primary);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--primary)}
.tl-item.k-audiencia .tl-dot{background:#7a4bd8;box-shadow:0 0 0 2px #7a4bd8}.tl-item.k-providencia .tl-dot{background:var(--ok);box-shadow:0 0 0 2px var(--ok)}.tl-item.k-notificacion .tl-dot{background:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.tl-body{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.6rem .8rem}.tl-item.open .tl-body{border-color:var(--primary)}
.tl-detail{display:none;margin-top:.4rem}.tl-item.open .tl-detail{display:block}
.tl-filter{display:flex;gap:.4rem;flex-wrap:wrap}
.htl{display:flex;overflow-x:auto;gap:0;padding:1.5rem .5rem .5rem;position:relative}
.htl .h{flex:0 0 auto;width:110px;text-align:center;position:relative;font-size:.72rem;cursor:pointer}.htl .h:before{content:"";position:absolute;top:-10px;left:0;right:0;height:3px;background:var(--border)}
.htl .h i{position:absolute;top:-16px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--primary)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal .dh{font-size:.72rem;text-align:center;color:var(--muted);font-weight:700}

.cal .ev{display:block;border-radius:4px;padding:0 3px;margin-top:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.66rem}
.ev.audiencia{background:#7a4bd8}.ev.vencimiento{background:var(--danger)}.ev.tarea{background:var(--info)}
@media(min-width:1024px){.cal .d{min-height:96px;font-size:.8rem}.cal .ev{font-size:.72rem}}
.phone{max-width:340px;margin:0 auto;border-radius:28px;border:8px solid #222;background:#e5ddd5;overflow:hidden}
.phone .wa-head{background:#075e54;color:#fff;padding:.6rem;font-weight:700;font-size:.9rem}.phone .wa-body{padding:.7rem;min-height:220px}
.bubble{background:#fff;color:#111;border-radius:10px;padding:.5rem .7rem;font-size:.85rem;margin-bottom:.5rem;box-shadow:0 1px 1px rgba(0,0,0,.1);max-width:90%;white-space:pre-wrap}
.bubble .t{display:block;text-align:right;font-size:.65rem;color:#777}
.mail{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;color:#111}.mail .mh{background:#f1f3f4;padding:.6rem;font-size:.82rem}.mail .mb{padding:.8rem;font-size:.88rem;white-space:pre-wrap}
.assist{border-left:4px solid var(--warn)}.assist.alta{border-left-color:var(--danger)}.assist.baja{border-left-color:var(--info)}
.rad-parts{display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem}@media(min-width:640px){.rad-parts{grid-template-columns:repeat(4,1fr)}}
.rad-parts div{background:var(--surface2);border-radius:8px;padding:.4rem .5rem;font-size:.78rem}.rad-parts b{display:block;font-family:ui-monospace,monospace;font-size:.95rem}
.err{color:var(--danger);font-size:.83rem;font-weight:600}.okt{color:var(--ok);font-size:.83rem;font-weight:600}
svg text{fill:var(--text)}.hide{display:none!important}
.tabs{display:flex;gap:.3rem;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:1rem}.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.6rem .8rem;min-height:44px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;font-size:.9rem}.tabs button.active{color:var(--primary);border-color:var(--primary)}
.doc-preview{background:#fff;color:#111;padding:1.5rem;border-radius:8px;border:1px solid var(--border);font-family:Georgia,"Times New Roman",serif;white-space:pre-wrap;font-size:.92rem;line-height:1.6}
@media print{.demo-banner,.topbar,.sidenav,.bottomnav,.no-print,.toast-wrap{display:none!important}main{padding:0}body{background:#fff;color:#000}.card{box-shadow:none;border:0}.print-area{display:block}}
label.row{flex-wrap:nowrap;align-items:flex-start;gap:.6rem}label.row input[type=checkbox]{flex:none;margin-top:1px}
.row>.ev{padding:2px 8px;border-radius:99px;font-size:.75rem}

/* v2: portal, solicitudes, jurisprudencia, prompts */
@media(max-width:560px){.hide-sm{display:none}}
.nb{margin-left:auto;font-size:.68rem;padding:1px 7px}
.subnav{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0 .8rem}.subnav a{text-decoration:none}.subnav a.active{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.ficha dt{font-weight:700;margin-top:.7rem}.ficha dd{margin:.2rem 0 0;white-space:pre-wrap}.ficha .nc{color:var(--muted);font-style:italic}
.conf{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.sol.nueva{border-left:4px solid var(--danger)}.sol.en_tramite{border-left:4px solid var(--warn)}.sol.respondida{border-left:4px solid var(--ok)}
.prompt-out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;min-height:50vh;width:100%}
.pub-act{border:1px solid var(--border);border-radius:12px;padding:.7rem;margin-bottom:.6rem}.pub-act.on{border-color:var(--ok)}

</style>

<script>window.LM_SINGLE=true;</script>
<script>
/* LexMonitor · Almacén compartido LexMonitor <-> Sitio web / Portal del cliente (DEMO, datos ficticios).
   Ambos se publican bajo el mismo origen y comparten este almacén en localStorage (y adjuntos en IndexedDB).
   En producción se reemplaza por un servidor con API y autenticación real (Fase 2).

   Esquema (localStorage['lexportal.v1']):
   { version:1, updatedAt,
     firma:     {nombre, abogado, email},
     clientes:  [{id, nombre, doc, docNorm}]                     // solo clientes con procesos publicados o acceso
     procesos:  [{id, clienteId, radicado, medio, despacho, estado, etapa, resumenCliente, actualizado}]  // SOLO los marcados "Publicar en portal"
     publicaciones: [{id, procesoId, fecha, titulo, resumen}]    // SOLO actuaciones publicadas con resumen para el cliente
     eventos:   [{id, procesoId, fecha, hora, titulo}]           // próximas fechas de procesos publicados
     accesos:   [{clienteId, docNorm, codigo, creado, activo}]   // generados en LexMonitor > Clientes
     solicitudes:[{id, fecha, origen:'contacto'|'portal'|'asistente', clienteId, procesoId, nombre, email, tel,
                   asunto, mensaje, adjuntos:[{id,nombre,size,tipo}], autorizacionDatos:true, estado:'nueva'|'en_tramite'|'respondida',
                   respuesta, respondidaEn, leidaCliente}] }
   Regla: LexMonitor escribe clientes/procesos/publicaciones/eventos/firma (proyección); ambos escriben solicitudes; LexMonitor escribe accesos. */
(function(){
const KEY='lexportal.v1', CH='lexmonitor-shared';
const S=window.LexShared={KEY};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const rel=n=>{const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()+n);return iso(t);};
S.uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
S.normDoc=s=>String(s||'').replace(/\D/g,'');
/* Resúmenes para el cliente de los datos de ejemplo (los usa también LexMonitor para marcar lo publicado) */
S.DEMO_PUB={
 p1:{resumen:'Demandamos la multa urbanística que le impusieron. El juzgado aceptó estudiar el caso y la entidad ya respondió. Lo siguiente es la audiencia inicial.',
     acts:{'Auto admite demanda':'El Tribunal aceptó estudiar su demanda (la "admitió"). Es un paso normal del inicio del proceso.',
           'Contestación de la demanda':'La entidad respondió la demanda y se opone. Lo revisaremos y lo discutiremos en la audiencia.',
           'Auto fija fecha de audiencia inicial':'El Tribunal fijó la fecha de la primera audiencia. Le contaremos cómo prepararnos.'}},
 p6:{resumen:'Pedimos que se corrija el cálculo de su pensión. El proceso ya pasó por las etapas principales y está esperando que el juez dicte sentencia.',
     acts:{'Admite':'El juzgado aceptó estudiar su demanda.','Al despacho para sentencia':'El expediente está en manos del juez para que escriba la sentencia. No requiere acción suya por ahora.'}},
 p5:{resumen:'La acción de tutela contra la EPS fue negada en primera instancia. Estamos evaluando impugnar (pedir que un juez superior la revise).',
     acts:{'Fallo niega amparo':'El juez negó la tutela. Estamos revisando la decisión para impugnarla dentro del plazo.'}}
};
S.DEMO_ACCESS=[{clienteId:'c2',docNorm:'00000002',doc:'C.C. 00.000.002',codigo:'DEMO-4821'},{clienteId:'c1',docNorm:'9000000010',doc:'NIT 900.000.001-0',codigo:'DEMO-7350'}];
function seed(){
  const P=(id,cli,rad,medio,desp,etapa)=>({id,clienteId:cli,radicado:rad,medio,despacho:desp,estado:'Activo',etapa,resumenCliente:S.DEMO_PUB[id].resumen,actualizado:rel(0)});
  const pubs=[];const add=(pid,d,t)=>pubs.push({id:S.uid(),procesoId:pid,fecha:rel(d),titulo:t,resumen:S.DEMO_PUB[pid].acts[t]});
  add('p1',-160,'Auto admite demanda');add('p1',-40,'Contestación de la demanda');add('p1',-5,'Auto fija fecha de audiencia inicial');
  add('p6',-1150,'Admite');add('p6',-260,'Al despacho para sentencia');add('p5',-2,'Fallo niega amparo');
  return {version:1,updatedAt:new Date().toISOString(),seed:true,
   firma:{nombre:'Firma de abogados (nombre por definir)',abogado:'Abogado(a) titular',email:'notificaciones@firma-ejemplo.test'},
   clientes:[{id:'c1',nombre:'Inversiones Alto Ricaurte S.A.S. (ficticio)',doc:'NIT 900.000.001-0',docNorm:'9000000010'},{id:'c2',nombre:'Mariela Toquica Fonseca (ficticia)',doc:'C.C. 00.000.002',docNorm:'00000002'}],
   procesos:[P('p1','c1','15001233300020250012300','Nulidad y restablecimiento del derecho','Tribunal Administrativo de Boyacá – Sala de Decisión','Contestación de la demanda'),
     P('p6','c2','15001333300520220011200','Nulidad y restablecimiento del derecho','Juzgado 5.º Administrativo del Circuito de Tunja','Sentencia de primera instancia'),
     P('p5','c2','15238400300120260021800','Acción de tutela','Juzgado 1.º Civil Municipal de Duitama (tutela)','Fallo de primera instancia')],
   publicaciones:pubs,
   eventos:[{id:'e1',procesoId:'p1',fecha:rel(9),hora:'09:00',titulo:'Audiencia inicial (art. 180 CPACA)'}],
   accesos:S.DEMO_ACCESS.map(a=>({clienteId:a.clienteId,docNorm:a.docNorm,codigo:a.codigo,creado:rel(-3),activo:true})),
   solicitudes:[{id:'s-demo1',fecha:rel(-2)+'T10:15',origen:'portal',clienteId:'c2',procesoId:'p6',nombre:'Mariela Toquica Fonseca (ficticia)',email:'mariela.t@ejemplo.test',tel:'',asunto:'¿Debo llevar algún documento?',mensaje:'Buenos días, ¿necesitan algún documento adicional para la sentencia? (mensaje ficticio)',adjuntos:[],autorizacionDatos:true,estado:'respondida',respuesta:'Por ahora no se necesita nada. Le avisaremos apenas el juez dicte sentencia. (respuesta ficticia)',respondidaEn:rel(-1)+'T16:40',leidaCliente:true},
     {id:'s-demo2',fecha:rel(0)+'T08:05',origen:'contacto',clienteId:'',procesoId:'',nombre:'Persona interesada (ficticia)',email:'interesado@ejemplo.test',tel:'300 000 0099',asunto:'Consulta sobre una sanción de tránsito',mensaje:'Me impusieron una sanción y quiero saber si se puede demandar. (mensaje ficticio)',adjuntos:[],autorizacionDatos:true,estado:'nueva',respuesta:'',respondidaEn:''}]};
}
S.load=function(){ try{ const s=localStorage.getItem(KEY); if(s){ const d=JSON.parse(s); if(d&&d.version) return d; } }catch(e){} const d=seed(); S.save(d,true); return d; };
let bc=null; try{ if('BroadcastChannel' in window) bc=new BroadcastChannel(CH); }catch(e){}
S.save=function(d,silent){ d.updatedAt=new Date().toISOString(); try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){ return false; } if(!silent&&bc) try{ bc.postMessage({t:'changed',at:d.updatedAt}); }catch(e){} return true; };
S.update=function(fn){ const d=S.load(); const r=fn(d); S.save(d); return r; };
S.reset=function(){ const d=seed(); S.save(d); return d; };
const subs=[]; S.onChange=fn=>subs.push(fn);
const fire=()=>subs.forEach(f=>{ try{ f(S.load()); }catch(e){ console.error(e); } });
window.addEventListener('storage',e=>{ if(e.key===KEY) fire(); });
if(bc) bc.onmessage=()=>fire();
/* Solicitudes */
S.addSolicitud=function(o){ return S.update(d=>{ const s=Object.assign({id:'s'+S.uid(),fecha:new Date().toISOString().slice(0,16),origen:'contacto',clienteId:'',procesoId:'',nombre:'',email:'',tel:'',asunto:'',mensaje:'',adjuntos:[],autorizacionDatos:false,estado:'nueva',respuesta:'',respondidaEn:''},o); const t=new Date(); s.fecha=iso(t)+'T'+pad(t.getHours())+':'+pad(t.getMinutes()); d.solicitudes.unshift(s); return s; }); };
S.countNuevas=d=>(d||S.load()).solicitudes.filter(s=>s.estado==='nueva').length;
/* Acceso al portal */
S.genCode=()=>{ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<6;i++) c+=A[Math.floor(Math.random()*A.length)]; return c.slice(0,3)+'-'+c.slice(3); };
S.login=function(doc,codigo){ const d=S.load(), n=S.normDoc(doc), c=String(codigo||'').trim().toUpperCase();
  const a=d.accesos.find(x=>x.activo&&x.docNorm===n&&x.codigo.toUpperCase()===c); if(!a) return null; return d.clientes.find(x=>x.id===a.clienteId)||{id:a.clienteId,nombre:'Cliente'}; };
/* Proyección desde LexMonitor: solo lo marcado para el portal */
S.syncFromLex=function(st){ const d=S.load(); const C=st.config||{}; const hoy=iso(new Date());
  const pubP=st.procesos.filter(p=>p.publicar);
  const accIds=new Set(d.accesos.map(a=>a.clienteId)); pubP.forEach(p=>accIds.add(p.clienteId));
  d.firma={nombre:C.firma||'',abogado:C.abogado||'',email:C.email||''};
  d.clientes=st.clientes.filter(c=>accIds.has(c.id)).map(c=>({id:c.id,nombre:c.nombre,doc:c.doc,docNorm:S.normDoc(c.doc)}));
  d.accesos.forEach(a=>{ const c=d.clientes.find(x=>x.id===a.clienteId); if(c) a.docNorm=c.docNorm; });
  d.procesos=pubP.map(p=>({id:p.id,clienteId:p.clienteId,radicado:p.radicado,medio:p.medio,despacho:p.despacho,estado:p.estado,etapa:p.etapa,resumenCliente:p.resumenCliente||'',actualizado:hoy}));
  d.publicaciones=[]; pubP.forEach(p=>(p.actuaciones||[]).filter(a=>a.publicar&&a.resumenCliente).forEach(a=>d.publicaciones.push({id:a.id,procesoId:p.id,fecha:a.fecha,titulo:a.titulo,resumen:a.resumenCliente})));
  d.eventos=[]; pubP.forEach(p=>(p.eventos||[]).filter(e=>e.fecha>=hoy&&e.tipo!=='tarea').forEach(e=>d.eventos.push({id:e.id,procesoId:p.id,fecha:e.fecha,hora:e.hora||'',titulo:e.titulo})));
  delete d.seed; const before=localStorage.getItem(KEY); const tmp=JSON.stringify(Object.assign({},d,{updatedAt:''})); const prev=before?JSON.stringify(Object.assign(JSON.parse(before),{updatedAt:''})):'';
  if(tmp!==prev) S.save(d); };
/* Adjuntos: misma base IndexedDB que LexMonitor ('lexmonitor-files') */
let dbp=null; function db(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error('Sin IndexedDB')); const q=indexedDB.open('lexmonitor-files',1); q.onupgradeneeded=()=>q.result.createObjectStore('files'); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); return dbp; }
const put=async(id,val)=>{ const d=await db(); return new Promise((res,rej)=>{ let t; try{ t=d.transaction('files','readwrite'); t.objectStore('files').put(val,id); }catch(e){ return rej(e); } t.oncomplete=res; t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error('abort')); }); };
/* Algunos navegadores (p. ej. Safari en modo privado) no guardan Blob en IndexedDB: se guarda como ArrayBuffer */
S.filePut=async(id,blob)=>{ try{ await put(id,blob); }catch(e){ const buf=await new Response(blob).arrayBuffer(); await put(id,{buf,type:blob.type||'application/octet-stream'}); } };
S.fileGet=async id=>{ const d=await db(); return new Promise((res,rej)=>{ const q=d.transaction('files').objectStore('files').get(id); q.onsuccess=()=>{ const r=q.result; res(r&&r.buf?new Blob([r.buf],{type:r.type}):r); }; q.onerror=()=>rej(q.error); }); };
})();

<script>
/* LexMonitor – utilidades, festivos, términos, radicado y almacenamiento */
(function(){
const LM = window.LM = window.LM || {};
const pad = n => String(n).padStart(2,'0');
LM.iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
LM.parse = s => { const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); };
LM.addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
LM.today = () => { const t = new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); };
LM.diffDays = (a,b) => Math.round((LM.parse(b)-LM.parse(a))/864e5);
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
LM.MES = MES; LM.DIA = DIA;
LM.fmt = s => { if(!s) return '—'; const d = typeof s==='string'?LM.parse(s):s; return d.getDate()+' '+MES[d.getMonth()].slice(0,3)+' '+d.getFullYear(); };
LM.fmtLong = s => { const d = typeof s==='string'?LM.parse(s):s; return DIA[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]+' de '+d.getFullYear(); };
LM.esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
LM.uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
LM.money = n => '$ '+Number(n||0).toLocaleString('es-CO');

/* ---- Festivos de Colombia (Ley 51 de 1983 "Ley Emiliani") ---- */
function easter(y){ // algoritmo de Meeus/Butcher (gregoriano)
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1; return new Date(y,month-1,day);
}
LM.easter = easter;
const nextMonday = d => { const x=new Date(d); const w=x.getDay(); if(w!==1) x.setDate(x.getDate()+((8-w)%7)); return x; };
const cache = {};
LM.holidays = function(y){
  if(cache[y]) return cache[y];
  const H = [];
  const add=(d,n)=>H.push({date:LM.iso(d),name:n});
  add(new Date(y,0,1),'Año Nuevo'); add(new Date(y,4,1),'Día del Trabajo'); add(new Date(y,6,20),'Independencia');
  add(new Date(y,7,7),'Batalla de Boyacá'); add(new Date(y,11,8),'Inmaculada Concepción'); add(new Date(y,11,25),'Navidad');
  [[0,6,'Reyes Magos'],[2,19,'San José'],[5,29,'San Pedro y San Pablo'],[7,15,'Asunción de la Virgen'],[9,12,'Día de la Raza'],[10,1,'Todos los Santos'],[10,11,'Independencia de Cartagena']]
    .forEach(([m,d,n])=>add(nextMonday(new Date(y,m,d)),n));
  const E = easter(y);
  add(LM.addDays(E,-3),'Jueves Santo'); add(LM.addDays(E,-2),'Viernes Santo');
  add(LM.addDays(E,43),'Ascensión del Señor'); add(LM.addDays(E,64),'Corpus Christi'); add(LM.addDays(E,71),'Sagrado Corazón');
  H.sort((a,b)=>a.date<b.date?-1:1); return cache[y]=H;
};
LM.holidayName = iso => { const h = LM.holidays(+iso.slice(0,4)).find(x=>x.date===iso); return h?h.name:null; };

/* Vacancia judicial: configurable (por defecto 20 dic – 10 ene, Decreto 1265 de 1970; y lunes a miércoles santos) */
LM.vacancia = function(iso){
  const cfg = (LM.state && LM.state.config) || {};
  const d = LM.parse(iso), y=d.getFullYear(), md = iso.slice(5);
  const ini = cfg.vacIni||'12-20', fin = cfg.vacFin||'01-10';
  if(md>=ini || md<=fin) return 'Vacancia judicial colectiva';
  if(cfg.vacSanta!==false){ const E=easter(y); for(let k=-6;k<=-4;k++) if(LM.iso(LM.addDays(E,k))===iso) return 'Vacancia de Semana Santa'; }
  return null;
};
LM.dayInfo = function(iso){
  const d = LM.parse(iso), w=d.getDay();
  if(w===0||w===6) return {habil:false,why:w===0?'Domingo':'Sábado'};
  const h = LM.holidayName(iso); if(h) return {habil:false,why:'Festivo: '+h};
  const v = LM.vacancia(iso); if(v) return {habil:false,why:v};
  return {habil:true};
};
LM.isHabil = iso => LM.dayInfo(iso).habil;
LM.nextHabil = iso => { let d=LM.parse(iso); while(!LM.isHabil(LM.iso(d))) d=LM.addDays(d,1); return LM.iso(d); };
/* Suma n días hábiles: el término empieza a correr el día hábil siguiente al hecho */
LM.addHabiles = function(iso,n,log){
  let d=LM.parse(iso), c=0, skipped=[];
  while(c<n){ d=LM.addDays(d,1); const s=LM.iso(d), inf=LM.dayInfo(s); if(inf.habil) c++; else skipped.push({date:s,why:inf.why}); }
  if(log) log.skipped = skipped; return LM.iso(d);
};
LM.addMonths = function(iso,n){ const d=LM.parse(iso); const day=d.getDate(); const t=new Date(d.getFullYear(),d.getMonth()+n,1);
  const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); t.setDate(Math.min(day,last)); return LM.iso(t); };
LM.habilesEntre = function(a,b){ let n=0,d=LM.parse(a); const e=LM.parse(b); while(d<e){ d=LM.addDays(d,1); if(LM.isHabil(LM.iso(d))) n++; } return n; };

/* Catálogo de términos. verified=true: tomado de norma citada; false: editable/validar con el abogado */
LM.TERMS = [
 {id:'cad-nrd',name:'Caducidad – Nulidad y restablecimiento del derecho',unit:'meses',n:4,base:'Día siguiente a la comunicación, notificación, ejecución o publicación del acto',norma:'Art. 164 num. 2 lit. d) CPACA',verified:true,calendar:true},
 {id:'cad-rd',name:'Caducidad – Reparación directa',unit:'años',n:2,base:'Día siguiente a la ocurrencia de la acción u omisión (o a su conocimiento)',norma:'Art. 164 num. 2 lit. i) CPACA',verified:true,calendar:true},
 {id:'not-199',name:'Notificación electrónica (se entiende surtida)',unit:'habiles',n:2,base:'Envío del mensaje de datos; los términos corren desde el día siguiente',norma:'Art. 199 CPACA (mod. art. 48 Ley 2080 de 2021)',verified:true},
 {id:'traslado-demanda',name:'Traslado de la demanda',unit:'habiles',n:30,base:'Día siguiente a la notificación surtida',norma:'Art. 172 CPACA',verified:false},
 {id:'apel-sent',name:'Apelación de sentencia',unit:'habiles',n:10,base:'Día siguiente a la notificación',norma:'Art. 247 CPACA',verified:false},
 {id:'apel-auto',name:'Apelación de auto',unit:'habiles',n:3,base:'Día siguiente a la notificación',norma:'Art. 244 CPACA',verified:false},
 {id:'reposicion',name:'Recurso de reposición',unit:'habiles',n:3,base:'Día siguiente a la notificación',norma:'Art. 242 CPACA / art. 318 CGP',verified:false},
 {id:'impugna-tutela',name:'Impugnación fallo de tutela',unit:'habiles',n:3,base:'Notificación del fallo',norma:'Art. 31 Decreto 2591 de 1991',verified:false},
 {id:'peticion',name:'Respuesta a derecho de petición',unit:'habiles',n:15,base:'Día siguiente a la radicación',norma:'Art. 14 CPACA (Ley 1755 de 2015)',verified:false},
 {id:'custom',name:'Término personalizado',unit:'habiles',n:5,base:'Definido por el usuario',norma:'—',verified:false}
];
/* Cálculo de un término; devuelve fecha de vencimiento y traza */
LM.computeTerm = function(t,startIso,opts){
  opts=opts||{}; const steps=[]; let start=startIso;
  if(opts.notifElectronica && t.id!=='not-199'){ const s=LM.addHabiles(startIso,2); steps.push('Notificación electrónica surtida el '+LM.fmtLong(s)+' (art. 199: 2 días hábiles tras el envío).'); start=s; }
  let end, log={};
  if(t.unit==='habiles'){ end=LM.addHabiles(start,t.n,log); steps.push(t.n+' días hábiles contados desde el día siguiente al '+LM.fmt(start)+'.'); if(log.skipped.length) steps.push('Se excluyeron '+log.skipped.length+' días no hábiles: '+log.skipped.filter(x=>!/Sábado|Domingo/.test(x.why)).map(x=>LM.fmt(x.date)+' ('+x.why+')').join('; ')+(log.skipped.some(x=>/Sábado|Domingo/.test(x.why))?' y fines de semana.':'')); }
  else if(t.unit==='calendario'){ end=LM.iso(LM.addDays(LM.parse(start),t.n)); steps.push(t.n+' días calendario.'); }
  else { const months = t.unit==='años'?t.n*12:t.n; end=LM.addMonths(start,months); steps.push(t.n+' '+t.unit+' calendario contados desde el '+LM.fmt(start)+' → '+LM.fmt(end)+'.');
    // El término por meses/años vence el mismo día del mes; si es inhábil se corre al siguiente hábil (art. 62 Ley 4 de 1913 / art. 118 CGP)
    if(!LM.isHabil(end)){ const n2=LM.nextHabil(end); steps.push(LM.fmt(end)+' no es hábil ('+LM.dayInfo(end).why+'); se traslada al '+LM.fmt(n2)+'.'); end=n2; } }
  return {end,steps,habilesRestantes: LM.today()<=LM.parse(end)?LM.habilesEntre(LM.iso(LM.today()),end):0};
};

/* ---- Radicado de 23 dígitos (estructura de la Rama Judicial) ---- */
const DEPTOS={'05':'Antioquia','08':'Atlántico','11':'Bogotá D.C.','13':'Bolívar','15':'Boyacá','17':'Caldas','18':'Caquetá','19':'Cauca','20':'Cesar','23':'Córdoba','25':'Cundinamarca','27':'Chocó','41':'Huila','44':'La Guajira','47':'Magdalena','50':'Meta','52':'Nariño','54':'Norte de Santander','63':'Quindío','66':'Risaralda','68':'Santander','70':'Sucre','73':'Tolima','76':'Valle del Cauca','81':'Arauca','85':'Casanare','86':'Putumayo','88':'San Andrés','91':'Amazonas','94':'Guainía','95':'Guaviare','97':'Vaupés','99':'Vichada'};
const MUNIS={'11001':'Bogotá D.C.','15001':'Tunja','15238':'Duitama','15759':'Sogamoso','15176':'Chiquinquirá','25307':'Girardot','25899':'Zipaquirá','25269':'Facatativá','25754':'Soacha','05001':'Medellín','76001':'Cali','08001':'Barranquilla','68001':'Bucaramanga'};
const ENTIDAD={'03':'Consejo de Estado','23':'Tribunal Administrativo','33':'Juzgado Administrativo','31':'Juzgado del Circuito','40':'Juzgado Municipal','22':'Tribunal Superior','02':'Corte Constitucional'};
const ESPEC={'33':'Contencioso administrativo','15':'Consejo de Estado – asuntos constitucionales / Sala Plena','24':'Consejo de Estado – Sección Primera','25':'Consejo de Estado – Sección Segunda','26':'Consejo de Estado – Sección Tercera','27':'Consejo de Estado – Sección Cuarta','28':'Consejo de Estado – Sección Quinta','05':'Laboral','03':'Civil','04':'Penal','10':'Familia'};
const SECCION={'1':'Sección Primera','2':'Sección Segunda','3':'Sección Tercera','4':'Sección Cuarta','5':'Sección Quinta'};
LM.parseRadicado = function(raw){
  const r = String(raw||'').replace(/\D/g,'');
  const errors=[];
  if(r.length!==23) errors.push('Debe tener exactamente 23 dígitos (tiene '+r.length+').');
  if(errors.length) return {ok:false,errors,clean:r};
  const p={depto:r.slice(0,2),municipio:r.slice(0,5),entidad:r.slice(5,7),especialidad:r.slice(7,9),despacho:r.slice(9,12),anio:r.slice(12,16),consecutivo:r.slice(16,21),instancia:r.slice(21,23)};
  if(!DEPTOS[p.depto]) errors.push('Código de departamento '+p.depto+' no reconocido (DIVIPOLA).');
  const y=+p.anio, cy=LM.today().getFullYear(); if(y<1990||y>cy) errors.push('Año de radicación '+p.anio+' fuera de rango (1990–'+cy+').');
  if(p.consecutivo==='00000') errors.push('El consecutivo no puede ser 00000.');
  if(!ENTIDAD[p.entidad]) errors.push('Código de entidad '+p.entidad+' no está en el catálogo de la maqueta.');
  const labels={depto:DEPTOS[p.depto]||'¿?',municipio:MUNIS[p.municipio]||'Municipio '+p.municipio.slice(2),entidad:ENTIDAD[p.entidad]||'¿?',especialidad:ESPEC[p.especialidad]||'Código '+p.especialidad,
    despacho:+p.despacho===0?'Despacho 000 (reparto de corporación)':'Despacho '+(+p.despacho),anio:p.anio,consecutivo:String(+p.consecutivo),instancia:p.instancia==='00'?'Primera / única instancia':'Instancia '+p.instancia};
  return {ok:errors.length===0,errors,clean:r,parts:p,labels,formatted:[r.slice(0,5),r.slice(5,7),r.slice(7,9),r.slice(9,12),r.slice(12,16),r.slice(16,21),r.slice(21)].join('-')};
};
LM.fmtRad = r => { r=String(r||'').replace(/\D/g,''); return r.length===23?[r.slice(0,5),r.slice(5,7),r.slice(7,9),r.slice(9,12),r.slice(12,16),r.slice(16,21),r.slice(21)].join('-'):r; };

/* ---- Almacenamiento: localStorage (datos) + IndexedDB (archivos adjuntos) ---- */
const KEY='lexmonitor.v1';
LM.save = function(){ try{ localStorage.setItem(KEY,JSON.stringify(LM.state)); }catch(e){ LM.toast && LM.toast('No se pudo guardar: '+e.message); }
  try{ if(window.LexShared&&LM.state) LexShared.syncFromLex(LM.state); }catch(e){ console.warn('Sincronización con portal: '+e.message); } };
LM.load = function(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; } };
LM.reset = function(){ LM.state = LM.demoData(); LM.save(); };
let dbp=null;
function db(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error('Sin IndexedDB'));
  const q=indexedDB.open('lexmonitor-files',1); q.onupgradeneeded=()=>q.result.createObjectStore('files'); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); return dbp; }
LM.filePut = async (id,blob)=>{ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction('files','readwrite'); t.objectStore('files').put(blob,id); t.oncomplete=res; t.onerror=()=>rej(t.error); }); };
LM.fileGet = async id=>{ const d=await db(); return new Promise((res,rej)=>{ const q=d.transaction('files').objectStore('files').get(id); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); };
LM.fileDel = async id=>{ const d=await db(); return new Promise(res=>{ const t=d.transaction('files','readwrite'); t.objectStore('files').delete(id); t.oncomplete=res; }); };
if(window.LexShared){ LM.filePut=(id,b)=>LexShared.filePut(id,b); LM.fileGet=id=>LexShared.fileGet(id); }
LM.download = function(name,content,type){ const b=content instanceof Blob?content:new Blob([content],{type:type||'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); };
})();

</script>
<script>
/* Datos de demostración 100% FICTICIOS. Fechas relativas a hoy para que la demo siempre tenga alertas vigentes. */
(function(){
const LM=window.LM;
LM.demoData=function(){
  const T=LM.today(); const D=n=>LM.iso(LM.addDays(T,n));

  const close=()=>{bg.remove();document.removeEventListener('keydown',k);}; const k=e=>{if(e.key==='Escape')close();};
  bg.addEventListener('click',e=>{ if(e.target===bg||e.target.closest('[data-close]')) close(); }); document.addEventListener('keydown',k);
  document.body.appendChild(bg); const f=bg.querySelector('input,select,textarea,button'); f&&f.focus(); onMount&&onMount(bg.querySelector('.modal'),close); return close; };
LM.proc=id=>LM.state.procesos.find(p=>p.id===id);

}
LM.route=function(){
  const h=location.hash.replace(/^#\/?/,'')||'tablero'; const [name,...args]=h.split('/');
  const v=LM.views[name]||LM.views.tablero; const navId=name==='proceso'?'procesos':name;

  LM.refreshChrome(); window.scrollTo(0,0);
};
LM.boot=function(){
  LM.state=LM.load()||LM.demoData(); if(!LM.state.config) LM.state=LM.demoData(); LM.migrate(LM.state); LM.save();
  if(window.LexShared) LexShared.onChange(()=>{ LM.refreshChrome(); const h=location.hash; const typing=document.activeElement&&/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName);

  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.LM_SINGLE){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
};

   '<div class="card"><h2>Procesos por medio de control</h2>'+donut(Object.entries(byMedio).map(([k,v])=>({k,v})))+'</div>'+

   S.alertas.slice().sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,4).map(a=>'<a class="item" href="#/proceso/'+a.procesoId+'"><div class="row between"><b>'+E(a.titulo)+'</b>'+(a.leida?'':'<span class="chip info">Nueva</span>')+'</div><div class="small muted">'+E((LM.proc(a.procesoId)||{}).medio||'')+' · '+a.fecha.replace('T',' ')+'</div></a>').join('')+'</div></div>'+
   '<div class="card assist"><div class="row between"><h2>🧭 El asistente encontró '+hall.length+' puntos a revisar</h2><a href="#/asistente" class="small">Revisar</a></div><div class="list">'+hall.slice(0,4).map(h=>'<div class="small"><span class="chip '+(h.nivel==='alta'?'danger':h.nivel==='media'?'warn':'info')+'">'+h.nivel+'</span> '+E(h.titulo)+'</div>').join('')+'</div></div></div>';

function kpi(n,l,href,cls){ return '<a class="card kpi item" href="'+href+'"><div class="n" style="color:var(--'+(cls||'text')+')">'+n+'</div><div class="l">'+l+'</div></a>'; }

LM.radPartsHtml=function(r){ if(!r.parts) return ''; const L=r.labels,P=r.parts; const f=(k,t)=>'<div><span class="muted">'+t+'</span><b>'+(k==='municipio'?P.municipio.slice(2):P[k])+'</b>'+E(L[k])+'</div>';

LM.procesoForm=function(p){

  LM.modal('<h2>'+(isNew?'Nuevo proceso':'Editar proceso')+'</h2><form id="pf" novalidate>'+
   '<label for="f-rad">Radicado (23 dígitos)</label><input id="f-rad" inputmode="numeric" autocomplete="off" value="'+E(p.radicado)+'" placeholder="15001-23-33-000-2026-00001-00"><div id="radMsg" class="small" aria-live="polite"></div><div id="radParts" style="margin-top:.4rem"></div>'+

   '<label for="f-res">Resumen</label><textarea id="f-res">'+E(p.resumen)+'</textarea><p id="fErr" class="err"></p>'+
   '<div class="row" style="justify-content:flex-end;margin-top:.8rem"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" id="f-save">Guardar proceso</button></div></form>',
  (m,close)=>{
    const rad=m.querySelector('#f-rad'); const check=()=>{ const r=LM.parseRadicado(rad.value); const msg=m.querySelector('#radMsg');

      if(isNew){ p.id='p'+LM.uid(); p.actuaciones=[{id:LM.uid(),fecha:LM.iso(LM.today()),tipo:'radicacion',titulo:'Proceso registrado en '+S.config.appName,detalle:'Alta manual.',fuente:'Usuario'}]; p.eventos=[]; p.documentos=[]; p.notas=''; p.jurisprudencia=[]; p.publicar=false; p.resumenCliente=''; S.procesos.unshift(p); }
      LM.save(); close(); LM.toast(isNew?'Proceso creado ✓':'Cambios guardados ✓'); location.hash='#/proceso/'+p.id; LM.route(); };
  });
  if(isNew&&location.hash.indexOf('nuevo')>=0){ history.replaceState(null,'','#/procesos'); LM.views.procesos(LM.$('#view'),[]); }

<script>
/* Módulos: Alertas SAMAI (simulado), Canales de notificación, Calculadora de términos, Asistente, Agenda */
(function(){
const LM=window.LM, V=LM.views, E=LM.esc;
/* ---- Simulador de monitoreo SAMAI: genera actuaciones ficticias plausibles ---- */
const PLANT=[['providencia','Auto que corre traslado de excepciones','Se corre traslado por 3 días de las excepciones propuestas.'],['notificacion','Notificación por estado electrónico','Estado publicado en el micrositio del despacho.'],['providencia','Auto requiere a la parte demandante','Allegar poder actualizado en 5 días.'],['audiencia','Auto reprograma audiencia','Se reprograma por agenda del despacho.'],['memorial','Memorial de la parte demandada','La entidad allega antecedentes administrativos.'],['providencia','Auto ordena oficiar','Se ordena oficiar a la entidad para que remita expediente.']];
LM.simulateSamai=function(manual){
  const S=LM.state; const act=S.procesos.filter(p=>p.estado==='Activo'); if(!act.length) return;
  const p=act[Math.floor(Math.random()*act.length)], t=PLANT[Math.floor(Math.random()*PLANT.length)], now=new Date(), hoy=LM.iso(LM.today());
  p.actuaciones.push({id:LM.uid(),fecha:hoy,tipo:t[0],titulo:t[1],detalle:t[2]+' (generada por el simulador)',fuente:'SAMAI (simulado)'});
  const a={id:LM.uid(),fecha:hoy+'T'+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),procesoId:p.id,titulo:'Nueva actuación: '+t[1],texto:t[2],leida:false,nivel:t[0]==='providencia'?'alta':'media'};
  S.alertas.push(a); S.simLog.unshift({at:now.toISOString(),consultados:act.length,nuevos:1,proc:p.id}); S.simLog=S.simLog.slice(0,30); LM.save();
  LM.toast('🔔 '+(manual?'Consulta simulada: ':'')+'nueva actuación en '+LM.fmtRad(p.radicado).slice(0,17)+'…'); LM.refreshChrome();
  if(S.config.canales.push&&window.Notification&&Notification.permission==='granted'){ try{ new Notification(S.config.appName,{body:a.titulo}); }catch(e){} }
  if(/^#\/(alertas|tablero)?$/.test(location.hash)||location.hash==='') LM.route(); return a;
};
let timer=null; LM.startScheduler=function(){ clearInterval(timer); if(LM.state.config.autoSim) timer=setInterval(()=>LM.simulateSamai(false),45000); };
LM.msgFor=function(a,canal){ const p=LM.proc(a.procesoId)||{}; const c=LM.cli(p.clienteId); const S=LM.state;
  if(canal==='whatsapp') return '*'+S.config.appName+'* ⚖️\n'+a.titulo+'\nRad. '+LM.fmtRad(p.radicado)+'\n'+(p.despacho||'')+'\n\n'+a.texto+'\n\nResponda 1 para ver detalle · 2 para agendar.';
  return {to:S.config.email,cc:c.email,subject:'['+S.config.appName+'] '+a.titulo+' – Rad. '+LM.fmtRad(p.radicado),body:'Cordial saludo,\n\nSe detectó una novedad en el proceso '+LM.fmtRad(p.radicado)+' ('+(p.medio||'')+') que cursa en '+(p.despacho||'')+'.\n\n• Novedad: '+a.titulo+'\n• Detalle: '+a.texto+'\n• Fecha de detección: '+a.fecha.replace('T',' ')+'\n\nRevise el expediente en SAMAI para confirmar.\n\n— '+S.config.appName+' (mensaje de demostración)'}; };

V.alertas=function(el){
  const S=LM.state; const list=S.alertas.slice().sort((a,b)=>a.fecha<b.fecha?1:-1);
  el.innerHTML='<div class="row between"><div><h1>Alertas SAMAI</h1><p class="small muted">Monitoreo <b>simulado</b>: en producción se consultaría SAMAI/CPNU '+S.config.horario.frecuencia+' veces al día en horario hábil, respetando robots.txt y límites del sitio.</p></div><div class="row"><button class="btn primary" id="sim">⟳ Simular consulta ahora</button><button class="btn" id="read">✓ Marcar todas leídas</button></div></div>'+
   '<div class="card row between" style="margin:.6rem 0"><label class="row" style="margin:0"><input type="checkbox" id="auto"'+(S.config.autoSim?' checked':'')+'> Simulación automática (una novedad cada 45 s mientras la app esté abierta)</label><span class="small muted">Última consulta: '+(S.simLog[0]?new Date(S.simLog[0].at).toLocaleString('es-CO'):'—')+'</span></div><div class="list">'+
   list.map(a=>{ const p=LM.proc(a.procesoId)||{}; return '<div class="item'+(a.leida?'':' assist '+a.nivel)+'"><div class="row between"><b>'+E(a.titulo)+'</b><span class="row">'+(a.leida?'':'<span class="chip info">Nueva</span>')+'<span class="chip '+(a.nivel==='alta'?'danger':a.nivel==='media'?'warn':'')+'">'+a.nivel+'</span></span></div><div class="small">'+E(a.texto)+'</div><div class="small muted mono">'+LM.fmtRad(p.radicado)+' · '+a.fecha.replace('T',' ')+'</div><div class="row" style="margin-top:.4rem"><a class="btn sm" href="#/proceso/'+p.id+'">Ver proceso</a><button class="btn sm" data-prev="'+a.id+'">💬 Vista previa WhatsApp / correo</button>'+(a.leida?'':'<button class="btn sm" data-r="'+a.id+'">Marcar leída</button>')+'</div></div>'; }).join('')+'</div>';
  el.querySelector('#sim').onclick=()=>{ LM.simulateSamai(true); V.alertas(el); };
  el.querySelector('#read').onclick=()=>{ S.alertas.forEach(a=>a.leida=true); LM.save(); LM.toast('Alertas marcadas como leídas'); LM.route(); };
  el.querySelector('#auto').onchange=e=>{ S.config.autoSim=e.target.checked; LM.save(); LM.startScheduler(); LM.toast(e.target.checked?'Simulación automática activada':'Simulación automática detenida'); };
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ S.alertas.find(a=>a.id===b.dataset.r).leida=true; LM.save(); LM.route(); });
  el.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>LM.previewModal(S.alertas.find(a=>a.id===b.dataset.prev)));
};
LM.previewModal=function(a){ const m=LM.msgFor(a,'email'); const now=new Date();
  LM.modal('<h2>Vista previa de notificación</h2><p class="small muted">Simulación: no se envía nada. En producción saldría por la API oficial de WhatsApp Business y por correo.</p><div class="grid g2"><div><h3>WhatsApp</h3><div class="phone"><div class="wa-head">'+E(LM.state.config.appName)+' · Alertas</div><div class="wa-body"><div class="bubble">'+E(LM.msgFor(a,'whatsapp'))+'<span class="t">'+now.toTimeString().slice(0,5)+' ✓✓</span></div></div></div></div><div><h3>Correo</h3><div class="mail"><div class="mh"><b>Para:</b> '+E(m.to)+'<br><b>CC:</b> '+E(m.cc)+'<br><b>Asunto:</b> '+E(m.subject)+'</div><div class="mb">'+E(m.body)+'</div></div></div></div><div class="row" style="justify-content:flex-end;margin-top:1rem"><button class="btn" id="cp">Copiar texto WhatsApp</button><button class="btn primary" data-close>Cerrar</button></div>',(md)=>{
    md.querySelector('#cp').onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(LM.msgFor(a,'whatsapp')):Promise.reject()).then(()=>LM.toast('Texto copiado ✓'),()=>LM.toast('No se pudo copiar en este navegador')); }; }); };

V.notificaciones=function(el){
  const S=LM.state, C=S.config; const a=S.alertas.slice().sort((x,y)=>x.fecha<y.fecha?1:-1)[0];
  el.innerHTML='<h1>Canales y horarios de alerta</h1><p class="small muted">Configure cómo y cuándo recibir las novedades. Los envíos son simulados en esta maqueta.</p><div class="grid g2"><div class="card"><h2>Canales</h2>'+
   [['email','📧 Correo electrónico'],['whatsapp','💬 WhatsApp (Business API)'],['push','🔔 Notificación del navegador / app']].map(([k,t])=>'<label class="row" style="font-weight:500"><input type="checkbox" data-c="'+k+'"'+(C.canales[k]?' checked':'')+'> '+t+'</label>').join('')+
   '<h2 style="margin-top:1rem">Horario</h2><div class="grid g2"><div><label for="hi">Desde</label><input type="time" id="hi" value="'+C.horario.inicio+'"></div><div><label for="hf">Hasta</label><input type="time" id="hf" value="'+C.horario.fin+'"></div></div><label for="fr">Consultas a SAMAI por día</label><select id="fr">'+[1,2,3,4,6].map(n=>'<option'+(n==C.horario.frecuencia?' selected':'')+'>'+n+'</option>').join('')+'</select><label class="row" style="font-weight:500"><input type="checkbox" id="dh"'+(C.horario.diasHabiles?' checked':'')+'> Solo días hábiles judiciales</label><p class="small muted" id="sched"></p><button class="btn primary" id="sv">Guardar configuración</button></div>'+
   '<div class="card"><h2>Vista previa con la última alerta</h2>'+(a?'<div class="phone"><div class="wa-head">'+E(C.appName)+' · Alertas</div><div class="wa-body"><div class="bubble">'+E(LM.msgFor(a,'whatsapp'))+'<span class="t">07:05 ✓✓</span></div></div></div><button class="btn" id="pv" style="margin-top:.8rem">Ver también el correo</button>':'Sin alertas')+'</div></div>';
  const sched=()=>{ const n=+el.querySelector('#fr').value, i=el.querySelector('#hi').value, f=el.querySelector('#hf').value; const [hi,mi]=i.split(':').map(Number),[hf,mf]=f.split(':').map(Number); const a0=hi*60+mi,a1=hf*60+mf; const t=[]; for(let k=0;k<n;k++){ const m=n===1?a0:Math.round(a0+(a1-a0)*k/(n-1)); t.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')); } el.querySelector('#sched').textContent='Consultas programadas: '+t.join(' · '); };
  el.querySelectorAll('#hi,#hf,#fr').forEach(x=>x.addEventListener('input',sched)); sched();
  el.querySelector('#sv').onclick=async()=>{ el.querySelectorAll('[data-c]').forEach(c=>C.canales[c.dataset.c]=c.checked); C.horario={inicio:el.querySelector('#hi').value,fin:el.querySelector('#hf').value,frecuencia:+el.querySelector('#fr').value,diasHabiles:el.querySelector('#dh').checked};
    if(C.canales.push&&window.Notification&&Notification.permission==='default'){ try{ await Notification.requestPermission(); }catch(e){} } LM.save(); LM.toast('Configuración de canales guardada ✓'); };
  const pv=el.querySelector('#pv'); pv&&(pv.onclick=()=>LM.previewModal(a));
};

/* ---- Calculadora de términos ---- */
V.terminos=function(el,args){
  const S=LM.state; const pid=args[0]||''; const f0=args[1]||LM.iso(LM.today());
  el.innerHTML='<h1>Calculadora de términos</h1><p class="small muted">Cuenta días hábiles judiciales: excluye sábados, domingos, festivos de Colombia (Ley 51 de 1983, con Pascua calculada) y vacancia judicial (colectiva y Semana Santa, configurable).</p><div class="grid g2"><div class="card">'+
   '<label for="t-term">Término</label><select id="t-term">'+LM.TERMS.map(t=>'<option value="'+t.id+'">'+(t.verified?'✓ ':'⚠ ')+E(t.name)+'</option>').join('')+'</select><div id="t-info" class="small" style="margin-top:.4rem"></div>'+
   '<div class="grid g2"><div><label for="t-n">Cantidad</label><input type="number" id="t-n" min="1"></div><div><label for="t-u">Unidad</label><select id="t-u"><option value="habiles">Días hábiles</option><option value="calendario">Días calendario</option><option value="meses">Meses</option><option value="años">Años</option></select></div></div>'+
   '<label for="t-f">Fecha del hecho / notificación / envío</label><input type="date" id="t-f" value="'+f0+'"><label class="row" style="font-weight:500"><input type="checkbox" id="t-ne"> La fecha es el ENVÍO de notificación electrónica (sumar 2 días hábiles, art. 199)</label>'+
   '<label for="t-p">Proceso (para agregar a la agenda)</label><select id="t-p"><option value="">— Ninguno —</option>'+S.procesos.map(p=>'<option value="'+p.id+'"'+(p.id===pid?' selected':'')+'>'+LM.fmtRad(p.radicado).slice(0,24)+'… · '+E(p.medio)+'</option>').join('')+'</select>'+
   '<button class="btn primary" id="t-calc" style="margin-top:1rem;width:100%">Calcular vencimiento</button></div><div class="card" id="t-res"><p class="muted">El resultado aparecerá aquí.</p></div></div>'+
   '<div class="card" style="margin-top:1rem"><div class="row between"><h2>Festivos y días inhábiles</h2><select id="t-y" style="width:auto">'+[2025,2026,2027].map(y=>'<option'+(y===LM.today().getFullYear()?' selected':'')+'>'+y+'</option>').join('')+'</select></div><div class="table-wrap" id="t-hol"></div></div>';
  const sel=el.querySelector('#t-term'); const cur=()=>LM.TERMS.find(t=>t.id===sel.value);
  const fill=()=>{ const t=cur(); el.querySelector('#t-n').value=t.n; el.querySelector('#t-u').value=t.unit; el.querySelector('#t-info').innerHTML=(t.verified?'<span class="chip ok">Verificado</span> ':'<span class="chip warn">Validar con el abogado</span> ')+E(t.norma)+' · Desde: '+E(t.base)+'<br><span class="muted">Puede editar la cantidad y la unidad.</span>'; };
  sel.onchange=fill; if(pid){ const p=LM.proc(pid); if(p&&/Reparaci/.test(p.medio)) sel.value='cad-rd'; else if(p&&/tutela/i.test(p.medio)) sel.value='impugna-tutela'; } fill();
  el.querySelector('#t-calc').onclick=()=>{ const base=cur(); const t=Object.assign({},base,{n:+el.querySelector('#t-n').value,unit:el.querySelector('#t-u').value}); const f=el.querySelector('#t-f').value;
    if(!f||!(t.n>0)) return LM.toast('Revise la fecha y la cantidad'); const edited=t.n!==base.n||t.unit!==base.unit;
    const r=LM.computeTerm(t,f,{notifElectronica:el.querySelector('#t-ne').checked}); const d=LM.diffDays(LM.iso(LM.today()),r.end);
    el.querySelector('#t-res').innerHTML='<div class="small muted">Vence el</div><div style="font-size:1.5rem;font-weight:800;color:var(--'+(d<0?'muted':d<=3?'danger':'primary')+')" id="t-out" data-end="'+r.end+'">'+LM.fmtLong(r.end)+'</div><div class="row" style="margin:.4rem 0">'+(d<0?'<span class="chip">Ya venció (hace '+(-d)+' días)</span>':'<span class="chip '+(d<=3?'danger':'warn')+'">Faltan '+d+' días calendario · '+r.habilesRestantes+' hábiles</span>')+((base.verified&&!edited)?'<span class="chip ok">Término verificado</span>':'<span class="chip warn">⚠ Validar con el abogado</span>')+'</div><ol class="small">'+r.steps.map(s=>'<li>'+E(s)+'</li>').join('')+'</ol><p class="small muted">'+E(t.norma)+'. Herramienta de apoyo: confirme siempre con el expediente y la norma vigente.</p><button class="btn primary" id="t-add">📅 Agregar a la agenda del proceso</button>';
    el.querySelector('#t-add').onclick=()=>{ const pid2=el.querySelector('#t-p').value; if(!pid2) return LM.toast('Seleccione el proceso primero'); const p=LM.proc(pid2); p.eventos=p.eventos||[];
      p.eventos.push({id:LM.uid(),tipo:'vencimiento',titulo:'Vence: '+t.name,fecha:r.end,norma:t.norma+((base.verified&&!edited)?'':' (validar con el abogado)'),preparada:false}); LM.save(); LM.toast('Vencimiento agregado a la agenda ✓'); }; };
  const hol=()=>{ const y=+el.querySelector('#t-y').value; const E2=LM.easter(y); const rows=LM.holidays(y).map(h=>'<tr><td>'+LM.fmtLong(h.date)+'</td><td>'+E(h.name)+'</td></tr>').join('');
    const ss=[-6,-5,-4].map(k=>LM.fmt(LM.addDays(E2,k))).join(', ');
    el.querySelector('#t-hol').innerHTML='<p class="small">Domingo de Pascua '+y+': <b>'+LM.fmtLong(E2)+'</b> · Vacancia Semana Santa (lun–mié): '+ss+' · Vacancia colectiva: '+S.config.vacIni.split('-').reverse().join('/')+' – '+S.config.vacFin.split('-').reverse().join('/')+'</p><table><thead><tr><th>Fecha</th><th>Festivo</th></tr></thead><tbody>'+rows+'</tbody></table>'; };
  el.querySelector('#t-y').onchange=hol; hol();
};

/* ---- Asistente de inconsistencias (reglas) ---- */
LM.runAssistant=function(){
  const S=LM.state, hoy=LM.iso(LM.today()), out=[]; const add=(p,nivel,regla,titulo,expl,sug,link)=>out.push({p,nivel,regla,titulo,expl,sug,link:link||'#/proceso/'+p.id});
  S.procesos.forEach(p=>{ if(p.estado==='Terminado') return; const acts=p.actuaciones||[]; const sorted=acts.slice().sort((a,b)=>a.fecha<b.fecha?1:-1); const last=sorted[0];
    (p.eventos||[]).filter(e=>e.tipo==='vencimiento'&&e.fecha<hoy).forEach(e=>{ if(!acts.some(a=>a.fecha>=e.fecha&&a.tipo==='memorial')) add(p,'alta','Término vencido sin actuación','Término vencido sin actuación: '+e.titulo,'El término venció el '+LM.fmt(e.fecha)+' y no hay memorial registrado desde esa fecha.','Verifique si se radicó el escrito y regístrelo; si no, evalúe consecuencias con el cliente.'); });
    if(last&&LM.diffDays(last.fecha,hoy)>(S.config.inactividadDias||180)) add(p,'media','Inactividad prolongada','Sin movimiento hace '+LM.diffDays(last.fecha,hoy)+' días','La última actuación es del '+LM.fmt(last.fecha)+' ('+E(last.titulo)+').','Considere un memorial de impulso procesal.','#/borradores/'+p.id+'/impulso');
    if(p.estado==='Pre-demanda'&&p.fechaHecho){ const t=LM.TERMS.find(x=>x.id===(/Reparaci/.test(p.medio)?'cad-rd':'cad-nrd')); const r=LM.computeTerm(t,p.fechaHecho); const d=LM.diffDays(hoy,r.end);
      if(d<=90) add(p,d<=30?'alta':'media','Caducidad en riesgo','Caducidad en riesgo: vence el '+LM.fmt(r.end)+' ('+d+' días)','Calculado con '+t.norma+' desde el '+LM.fmt(p.fechaHecho)+'. No incluye la suspensión por conciliación extrajudicial (art. 21 Ley 640/2001 o norma vigente), que debe sumarse manualmente.','Priorice la radicación de la demanda y valide la suspensión con el abogado.','#/terminos/'+p.id+'/'+p.fechaHecho); }
    const r=LM.parseRadicado(p.radicado); if(!r.ok) add(p,'alta','Radicado mal formado','Radicado mal formado: '+p.radicado,r.errors.join(' '),'Corrija el radicado: sin él no es posible el seguimiento automático en SAMAI.');
    const chron=acts.slice().sort((a,b)=>a.fecha<b.fecha?-1:1);
    const ad=chron.find(a=>/admite|admisi/i.test(a.titulo)), rad=chron.find(a=>a.tipo==='radicacion');
    const sen=chron.find(a=>/^sentencia/i.test(a.titulo)), alg=chron.find(a=>/alegatos|juzgamiento/i.test(a.titulo));
    if((ad&&rad&&ad.fecha<rad.fecha)||(sen&&alg&&alg.fecha>sen.fecha)) add(p,'media','Actuaciones fuera de orden','Actuaciones fuera de orden lógico',(sen&&alg&&alg.fecha>sen.fecha)?'La "'+alg.titulo+'" ('+LM.fmt(alg.fecha)+') figura después de la sentencia ('+LM.fmt(sen.fecha)+').':'La admisión aparece antes de la radicación.','Revise las fechas cargadas; puede ser un error de digitación.');
    /* Regla: datos faltantes (no se suponen valores) */
    const falt=[]; const cl=S.clientes.find(c=>c.id===p.clienteId);
    if(!cl) falt.push('cliente'); if(!String(p.despacho||'').trim()||/^[—-]$/.test(String(p.despacho).trim())) falt.push('despacho');
    if(!String(p.medio||'').trim()) falt.push('medio de control');
    if(p.estado!=='Pre-demanda'&&!p.fechaPresentacion&&!acts.some(a=>a.tipo==='radicacion'||a.tipo==='notificacion')) falt.push('fecha de presentación o notificación');
    if(!String(p.apoderado||'').trim()) falt.push('apoderado');
    if(falt.length) add(p,falt.length>1||falt.includes('fecha de presentación o notificación')?'alta':'media','Datos faltantes','Datos faltantes: '+falt.join(', '),'El proceso no tiene registrado: '+falt.join(', ')+'. El sistema no supone ni rellena estos valores; sin ellos no es confiable calcular términos ni generar escritos.','Complete los datos desde "Editar" en la ficha del proceso, verificándolos en el expediente.');
    (p.eventos||[]).filter(e=>e.tipo==='audiencia'&&!e.preparada&&e.fecha>=hoy&&LM.diffDays(hoy,e.fecha)<=14).forEach(e=>add(p,LM.diffDays(hoy,e.fecha)<=7?'alta':'media','Audiencia sin preparación','Audiencia en '+LM.diffDays(hoy,e.fecha)+' días sin preparar: '+e.titulo,'Programada para el '+LM.fmtLong(e.fecha)+(e.hora?' a las '+e.hora:'')+'; no está marcada como preparada.','Prepare la teoría del caso, pruebas y poder; márquela como preparada en la ficha.','#/proceso/'+p.id+'/agenda'));
  });
  const o={alta:0,media:1,baja:2}; return out.sort((a,b)=>o[a.nivel]-o[b.nivel]);
};
V.asistente=function(el){ const h=LM.runAssistant(); const reglas=[...new Set(h.map(x=>x.regla))];
  el.innerHTML='<h1>🧭 Asistente de revisión</h1><p class="small muted">Revisa la cartera con reglas explícitas (no es inteligencia artificial generativa): términos vencidos sin actuación, inactividad prolongada (> '+LM.state.config.inactividadDias+' días), caducidad en riesgo, radicado mal formado, actuaciones fuera de orden, audiencias sin preparación y datos faltantes (cliente, despacho, medio de control, fecha de presentación/notificación, apoderado).</p><div class="row" style="margin:.5rem 0"><span class="chip danger">'+h.filter(x=>x.nivel==='alta').length+' alta</span><span class="chip warn">'+h.filter(x=>x.nivel==='media').length+' media</span>'+reglas.map(r=>'<span class="chip">'+E(r)+'</span>').join('')+'</div><div class="list">'+
   h.map(x=>'<div class="card assist '+x.nivel+'"><div class="row between"><b>'+E(x.titulo)+'</b><span class="chip '+(x.nivel==='alta'?'danger':'warn')+'">'+x.nivel+'</span></div><div class="small muted mono">'+LM.fmtRad(x.p.radicado)+' · '+E(x.p.medio)+'</div><p class="small"><b>Por qué:</b> '+E(x.expl)+'<br><b>Sugerencia:</b> '+E(x.sug)+'</p><a class="btn sm primary" href="'+x.link+'">Atender</a></div>').join('')+(h.length?'':'<p class="okt">Sin inconsistencias. 👍</p>')+'</div>'; };

/* ---- Agenda mensual ---- */
V.agenda=function(el,args){
  const T=LM.today(); let [y,m]=(args[0]||LM.iso(T).slice(0,7)).split('-').map(Number); const first=new Date(y,m-1,1); const start=LM.addDays(first,-((first.getDay()+6)%7)); const ev=LM.allEvents(); const hoy=LM.iso(T);
  const prev=LM.iso(new Date(y,m-2,1)).slice(0,7), next=LM.iso(new Date(y,m,1)).slice(0,7);
  let cells=''; for(let i=0;i<42;i++){ const d=LM.addDays(start,i), s=LM.iso(d), inf=LM.dayInfo(s), es=ev.filter(e=>e.fecha===s); const hol=LM.holidayName(s), vac=LM.vacancia(s);
    cells+='<div class="d'+(d.getMonth()!==m-1?' off':'')+(hol?' hol':vac&&d.getDay()%6?' vac':'')+(s===hoy?' today':'')+'" data-d="'+s+'" title="'+E(inf.habil?'Día hábil':inf.why)+'"><b>'+d.getDate()+'</b>'+(hol?'<span class="small" style="display:block;color:var(--danger);font-size:.6rem">'+E(hol)+'</span>':'')+es.map(e=>'<span class="ev '+e.tipo+'">'+(e.hora?e.hora+' ':'')+E(e.titulo)+'</span>').join('')+'</div>'; }
  const mes=ev.filter(e=>e.fecha.slice(0,7)===LM.iso(first).slice(0,7));
  el.innerHTML='<div class="row between"><h1>Agenda · '+LM.MES[m-1]+' '+y+'</h1><div class="row"><a class="btn sm" href="#/agenda/'+prev+'" aria-label="Mes anterior">‹</a><a class="btn sm" href="#/agenda">Hoy</a><a class="btn sm" href="#/agenda/'+next+'" aria-label="Mes siguiente">›</a><button class="btn sm primary" id="ne">＋ Evento</button></div></div><div class="row small" style="margin:.4rem 0"><span class="ev audiencia" style="display:inline-block">Audiencia</span><span class="ev vencimiento" style="display:inline-block">Vencimiento</span><span class="ev tarea" style="display:inline-block">Tarea</span><span class="chip danger">Festivo</span><span class="chip warn">Vacancia</span></div>'+
   '<div class="cal">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>'<div class="dh">'+d+'</div>').join('')+cells+'</div><div class="card" style="margin-top:1rem"><h2>Eventos del mes ('+mes.length+')</h2><div class="list">'+mes.map(e=>'<a class="item" href="#/proceso/'+e.proceso.id+'/agenda"><div class="row between"><b>'+E(e.titulo)+'</b><span class="chip '+(e.tipo==='audiencia'?'info':'danger')+'">'+e.tipo+'</span></div><div class="small muted">'+LM.fmtLong(e.fecha)+(e.hora?' · '+e.hora:'')+' · '+LM.fmtRad(e.proceso.radicado)+'</div></a>').join('')+'</div></div>';
  el.querySelector('#ne').onclick=()=>LM.eventForm(null,()=>V.agenda(el,args));
  el.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{ const s=c.dataset.d, inf=LM.dayInfo(s), es=ev.filter(e=>e.fecha===s);
    LM.modal('<h2>'+LM.fmtLong(s)+'</h2><p>'+(inf.habil?'<span class="chip ok">Día hábil</span>':'<span class="chip danger">'+E(inf.why)+'</span>')+'</p><div class="list">'+(es.map(e=>'<a class="item" href="#/proceso/'+e.proceso.id+'/agenda"><b>'+E(e.titulo)+'</b><div class="small muted">'+E(e.proceso.medio)+'</div></a>').join('')||'<p class="muted">Sin eventos.</p>')+'</div><div class="row" style="justify-content:flex-end;margin-top:1rem"><button class="btn" data-close>Cerrar</button></div>',(md,close)=>md.querySelectorAll('a').forEach(a=>a.addEventListener('click',close))); });
};
})();

V.config=function(el){ const S=LM.state, C=S.config;
  const f=(k,l,t)=>'<div><label for="cf-'+k+'">'+l+'</label><input id="cf-'+k+'" type="'+(t||'text')+'" value="'+E(C[k])+'"></div>';
  el.innerHTML='<h1>Configuración</h1><div class="grid g2"><div class="card"><h2>Firma y producto</h2><div class="grid g2">'+f('appName','Nombre del producto')+f('firma','Nombre de la firma')+f('abogado','Abogado(a) titular')+f('tp','Tarjeta profesional')+f('email','Correo de notificaciones','email')+f('ciudad','Ciudad')+'</div><label for="cf-theme">Tema</label><select id="cf-theme">'+[['auto','Automático'],['light','Claro'],['dark','Oscuro']].map(([k,t])=>'<option value="'+k+'"'+(C.theme===k?' selected':'')+'>'+t+'</option>').join('')+'</select></div>'+
  '<div class="card"><h2>Reglas de términos</h2><div class="grid g2"><div><label for="cf-vi">Inicio vacancia colectiva (MM-DD)</label><input id="cf-vi" value="'+C.vacIni+'" pattern="\\d\\d-\\d\\d"></div><div><label for="cf-vf">Fin vacancia colectiva (MM-DD)</label><input id="cf-vf" value="'+C.vacFin+'"></div></div><label class="row" style="font-weight:500"><input type="checkbox" id="cf-vs"'+(C.vacSanta?' checked':'')+'> Vacancia lunes a miércoles de Semana Santa</label><label for="cf-in">Días para alertar inactividad</label><input id="cf-in" type="number" value="'+C.inactividadDias+'"><p class="small muted">Por defecto 20 dic – 10 ene (Decreto 1265 de 1970). Ajústelo si el Consejo Superior de la Judicatura fija otra cosa.</p></div></div>'+
  '<div class="row" style="margin-top:1rem"><button class="btn primary" id="cf-save">Guardar configuración</button></div>'+
  '<div class="card" style="margin-top:1rem"><h2>Datos</h2><p class="small muted">Todo se guarda en este navegador. Exporte un respaldo JSON para llevarlo a otro equipo.</p><div class="row"><button class="btn" id="exp">⬇ Exportar JSON</button><label class="btn" for="imp" style="margin:0">⬆ Importar JSON</label><input type="file" id="imp" accept="application/json,.json" class="hide"><button class="btn danger" id="rst">↺ Restaurar datos de demostración</button></div><p class="small muted" style="margin-top:.6rem">'+S.procesos.length+' procesos · '+S.clientes.length+' clientes · '+S.alertas.length+' alertas · tamaño '+Math.round(JSON.stringify(S).length/1024)+' KB</p></div>'+
  '<div class="card" style="margin-top:1rem"><h2>Acerca de</h2><p class="small">Maqueta funcional offline. Sin conexión a SAMAI, CPNU, WhatsApp ni correo: esas integraciones se simulan. Los datos son ficticios. '+(/^https?:$/.test(location.protocol)?'Instalable como app (PWA).':'Abierta como archivo local: para instalarla como app, sírvala por HTTPS.')+'</p></div>';
  el.querySelector('#cf-save').onclick=()=>{ ['appName','firma','abogado','tp','email','ciudad'].forEach(k=>C[k]=el.querySelector('#cf-'+k).value.trim()||C[k]); C.theme=el.querySelector('#cf-theme').value;
    const vi=el.querySelector('#cf-vi').value, vf=el.querySelector('#cf-vf').value; if(!/^\d\d-\d\d$/.test(vi)||!/^\d\d-\d\d$/.test(vf)) return LM.toast('Formato de vacancia: MM-DD');
    C.vacIni=vi; C.vacFin=vf; C.vacSanta=el.querySelector('#cf-vs').checked; C.inactividadDias=+el.querySelector('#cf-in').value||180; LM.save(); LM.applyTheme(); LM.refreshChrome(); LM.toast('Configuración guardada ✓'); };
  el.querySelector('#exp').onclick=()=>{ LM.download('lexmonitor-respaldo-'+LM.iso(LM.today())+'.json',JSON.stringify(S,null,2),'application/json'); LM.toast('Respaldo exportado ✓'); };
  el.querySelector('#imp').onchange=e=>{ const file=e.target.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.procesos||!d.config) throw new Error('Estructura no reconocida'); LM.state=d; LM.save(); LM.applyTheme(); LM.toast('Datos importados ✓'); LM.route(); }catch(err){ LM.toast('No se pudo importar: '+err.message); } }; rd.readAsText(file); };
  el.querySelector('#rst').onclick=()=>{ if(!confirm('¿Reemplazar todos los datos por la demostración?')) return; LM.reset(); LM.applyTheme(); LM.toast('Datos de demostración restaurados'); LM.route(); };
};
})();
