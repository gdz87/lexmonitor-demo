<script>
/* Módulos v2: Fichas de jurisprudencia, Biblioteca de instrucciones para IA, Portal del cliente (publicación y accesos), Solicitudes del portal */
(function(){
const LM=window.LM, V=LM.views, E=LM.esc, SH=window.LexShared;
const NC='No consta en el documento';
LM.sitioURL=window.LM_SINGLE?'https://gdz87.github.io/lexmonitor-demo/sitio/':'sitio/';
/* ================= FICHAS DE JURISPRUDENCIA ================= */
const JF=[['hechos','Hechos'],['problema','Problema jurídico'],['consideraciones','Consideraciones'],['regla','Conclusión / regla'],['observaciones','Observaciones / relevancia para el caso']];
const JID=[['corporacion','Corporación'],['sala','Sala / sección'],['radicado','Radicado'],['fecha','Fecha'],['ponente','Ponente']];
const v=x=>String(x||'').trim();
LM.fichaHtml=function(j,p){ const val=(k)=>{ const t=v(j[k]); return t?(k==='fecha'?LM.fmtLong(t):E(t)):'<span class="nc">'+NC+'</span>'; };
  return '<div class="ficha"><h3>Ficha de jurisprudencia</h3>'+(p?'<p class="small muted">Proceso: '+LM.fmtRad(p.radicado)+' · '+E(p.medio)+'</p>':'')+
   '<table><tbody>'+JID.map(([k,t])=>'<tr><th style="width:32%">'+t+'</th><td>'+val(k)+'</td></tr>').join('')+'</tbody></table><dl>'+JF.map(([k,t])=>'<dt>'+t+'</dt><dd>'+val(k)+'</dd>').join('')+'</dl></div>'; };
LM.fichaDoc=function(list,p){ const body=list.map(j=>LM.fichaHtml(j,p).replace(/class="nc"/g,'style="color:#666;font-style:italic"')).join('<br style="page-break-before:always">');
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Fichas de jurisprudencia</title><style>body{font-family:Times New Roman;font-size:12pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:4px;text-align:left;vertical-align:top}dt{font-weight:bold;margin-top:10pt}dd{margin:0 0 0 0}</style></head><body><p style="color:#a35d00;font-size:9pt">Documento de demostración. Verifique cada ficha contra la providencia original antes de citarla.</p>'+body+'</body></html>'; };
LM.jurisForm=function(p,j,done){ const isNew=!j; j=j||{id:'j'+LM.uid()};
  const inp=(k,t,type)=>'<div><label for="j-'+k+'">'+t+'</label><input id="j-'+k+'" type="'+(type||'text')+'" value="'+E(j[k]||'')+'"></div>';
  LM.modal('<h2>'+(isNew?'Nueva':'Editar')+' ficha de jurisprudencia</h2><p class="small muted">Copie solo lo que diga la providencia. Lo que deje vacío se mostrará como «'+NC+'».</p><form id="jf"><h3>Identificación</h3><div class="grid g2">'+inp('corporacion','Corporación')+inp('sala','Sala / sección')+inp('radicado','Radicado')+inp('fecha','Fecha','date')+inp('ponente','Ponente')+'</div>'+
   JF.map(([k,t])=>'<label for="j-'+k+'">'+t+'</label><textarea id="j-'+k+'">'+E(j[k]||'')+'</textarea>').join('')+
   '<div class="row" style="justify-content:flex-end;margin-top:.8rem"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary">Guardar ficha</button></div></form>',(m,close)=>{
   m.querySelector('#jf').onsubmit=e=>{ e.preventDefault(); JID.concat(JF).forEach(([k])=>j[k]=m.querySelector('#j-'+k).value.trim()); p.jurisprudencia=p.jurisprudencia||[]; if(isNew) p.jurisprudencia.push(j); LM.save(); close(); LM.toast('Ficha guardada ✓'); done&&done(); }; }); };
LM.jurisTab=function(tc,p,redraw){ const L=p.jurisprudencia=p.jurisprudencia||[];
  tc.innerHTML='<div class="row between"><h2>Fichas de jurisprudencia ('+L.length+')</h2><div class="row"><button class="btn sm primary" id="jn">＋ Nueva ficha</button>'+(L.length?'<button class="btn sm" id="jdocall">⬇ Todas (.doc)</button>':'')+'</div></div><p class="small muted">Fichas con estructura fija. Las de ejemplo son ficticias y no deben citarse.</p><div class="list">'+
   (L.map(j=>'<div class="card"><div class="row between"><b>'+E(v(j.corporacion)||NC)+'</b><span class="small muted">'+(j.fecha?LM.fmt(j.fecha):NC)+'</span></div><div class="small muted">'+E(v(j.sala)||'')+' · Rad. '+E(v(j.radicado)||NC)+'</div><p class="small"><b>Regla:</b> '+(E(v(j.regla))||'<i class="muted">'+NC+'</i>')+'</p><div class="row"><button class="btn sm" data-jv="'+j.id+'">Ver ficha</button><button class="btn sm" data-je="'+j.id+'">✎ Editar</button><button class="btn sm" data-jd="'+j.id+'">⬇ .doc</button><button class="btn sm" data-jp="'+j.id+'">🖨 Imprimir</button><button class="btn sm danger" data-jx="'+j.id+'">Eliminar</button></div></div>').join('')||'<p class="muted">Aún no hay fichas para este proceso.</p>')+'</div>';
  const f=id=>L.find(x=>x.id===id);
  tc.querySelector('#jn').onclick=()=>LM.jurisForm(p,null,redraw);
  const all=tc.querySelector('#jdocall'); if(all) all.onclick=()=>{ LM.download('Fichas_jurisprudencia_'+p.radicado.slice(-9)+'.doc','\ufeff'+LM.fichaDoc(L,p),'application/msword'); LM.toast('Fichas descargadas ✓'); };
  tc.querySelectorAll('[data-jv]').forEach(b=>b.onclick=()=>LM.modal(LM.fichaHtml(f(b.dataset.jv),p)+'<div class="row" style="justify-content:flex-end;margin-top:1rem"><button class="btn" data-close>Cerrar</button></div>'));
  tc.querySelectorAll('[data-je]').forEach(b=>b.onclick=()=>LM.jurisForm(p,f(b.dataset.je),redraw));
  tc.querySelectorAll('[data-jd]').forEach(b=>b.onclick=()=>{ LM.download('Ficha_'+b.dataset.jd+'.doc','\ufeff'+LM.fichaDoc([f(b.dataset.jd)],p),'application/msword'); LM.toast('Ficha descargada ✓'); });
  tc.querySelectorAll('[data-jp]').forEach(b=>b.onclick=()=>LM.printDoc('<p class="f">Documento de demostración.</p>'+LM.fichaHtml(f(b.dataset.jp),p).replace(/class="nc"/g,'style="color:#666;font-style:italic"')));
  tc.querySelectorAll('[data-jx]').forEach(b=>b.onclick=()=>{ if(!confirm('¿Eliminar esta ficha?')) return; p.jurisprudencia=L.filter(x=>x.id!==b.dataset.jx); LM.save(); LM.toast('Ficha eliminada'); redraw(); });
};

/* ================= BIBLIOTECA DE INSTRUCCIONES PARA IA ================= */
const REGLAS=`REGLAS OBLIGATORIAS
1. No inventes nada que no esté en los documentos o datos que te entrego. Si un dato falta, escribe exactamente: "No consta".
2. Las citas normativas deben ser textuales y solo si el texto de la norma aparece en lo que te entrego; si no lo tienes, escribe "[norma por verificar: …]" y no la parafrasees como si fuera cita.
3. No inventes jurisprudencia, radicados, fechas, nombres ni cifras.
4. Distingue claramente hechos (lo que dicen los documentos) de argumentos (tu propuesta).
5. Al final, incluye una lista "PUNTOS A VERIFICAR POR EL ABOGADO" con todo dato faltante o dudoso.`;
const P=[
 ['contestacion','Contestación de demanda','Actúa como abogado(a) litigante en derecho administrativo colombiano. Redacta un BORRADOR de contestación de demanda.','ESTRUCTURA\n1. Encabezado (despacho, radicado, medio de control, partes).\n2. Pronunciamiento sobre las pretensiones (una por una).\n3. Pronunciamiento sobre los hechos (admitido / no admitido / no consta, uno por uno, con la razón).\n4. Excepciones (previas y de fondo) con su fundamento en los documentos.\n5. Fundamentos de derecho (citas textuales o [norma por verificar]).\n6. Pruebas que se aportan y que se solicitan.\n7. Anexos y notificaciones.'],
 ['reposicion','Recurso de reposición','Actúa como abogado(a) litigante en derecho administrativo colombiano. Redacta un BORRADOR de recurso de reposición contra la providencia indicada.','ESTRUCTURA\n1. Encabezado e identificación de la providencia recurrida (fecha y contenido según el documento).\n2. Oportunidad: fecha de notificación y término (si no consta, escribe "No consta" y no lo calcules).\n3. Procedencia del recurso (cita textual o [norma por verificar]).\n4. Motivos de inconformidad, numerados.\n5. Petición concreta.\n6. Pruebas o anexos, si los hay.'],
 ['apelacion','Recurso de apelación','Actúa como abogado(a) litigante en derecho administrativo colombiano. Redacta un BORRADOR de recurso de apelación.','ESTRUCTURA\n1. Encabezado e identificación de la decisión apelada.\n2. Oportunidad y procedencia (sin calcular términos que no consten).\n3. Reparos concretos a la decisión, uno por uno, citando la parte del texto apelado.\n4. Sustentación de cada reparo con base en los documentos.\n5. Peticiones al superior.\n6. Anexos.'],
 ['tutela','Acción de tutela','Actúa como abogado(a) en derecho constitucional colombiano. Redacta un BORRADOR de acción de tutela.','ESTRUCTURA\n1. Juez competente (si no consta, "No consta").\n2. Partes (accionante, accionado, vinculados).\n3. Hechos numerados, solo los que constan.\n4. Derechos fundamentales presuntamente vulnerados.\n5. Procedencia: subsidiariedad e inmediatez, con base en los hechos.\n6. Pretensiones.\n7. Pruebas.\n8. Juramento (manifestación de no haber presentado otra tutela por los mismos hechos — confirmar con el cliente).\n9. Notificaciones.'],
 ['concepto','Concepto jurídico','Actúa como abogado(a) consultor(a) en derecho administrativo colombiano. Elabora un BORRADOR de concepto jurídico.','ESTRUCTURA\n1. Pregunta planteada.\n2. Antecedentes (solo hechos de los documentos).\n3. Marco normativo (citas textuales o [norma por verificar]).\n4. Análisis.\n5. Conclusión y recomendaciones.\n6. Riesgos y limitaciones del concepto.'],
 ['ficha','Ficha de jurisprudencia','Actúa como asistente de investigación jurídica. Elabora una ficha de jurisprudencia de la providencia que te entrego.','ESTRUCTURA (respeta exactamente estos campos)\n1. Identificación: corporación, sala/sección, radicado, fecha, ponente.\n2. Hechos.\n3. Problema jurídico.\n4. Consideraciones (resumen fiel; citas textuales entre comillas con su página o párrafo).\n5. Conclusión / regla.\n6. Observaciones / relevancia para el caso (relación con los datos del proceso).\nSi un campo no aparece en la providencia, escribe "No consta en el documento".'],
 ['resumen','Resumen de providencia','Actúa como asistente jurídico. Resume la providencia que te entrego para el abogado y, aparte, en lenguaje sencillo para el cliente.','ESTRUCTURA\n1. Datos de la providencia (tipo, fecha, despacho).\n2. Qué decidió (parte resolutiva, casi textual).\n3. Razones principales.\n4. Qué sigue y qué términos se abren (solo si constan; no los calcules).\n5. Versión para el cliente: máximo 5 frases, sin tecnicismos.'],
 ['comparar','Comparar documentos','Actúa como asistente jurídico en derecho administrativo colombiano. Compara los dos documentos que te entrego (por ejemplo, demanda vs. contestación, o versión A vs. versión B de un contrato o acto administrativo).','ESTRUCTURA (presenta cada punto como TABLA con columnas: Tema | Documento A (cita textual) | Documento B (cita textual) | Observación)\n1. Coincidencias.\n2. Diferencias (agregados, supresiones y cambios de redacción).\n3. Hechos: aceptados / negados / no contestados (si es demanda vs. contestación), uno por uno, con el fragmento de cada documento.\n4. Pretensiones vs. excepciones: qué excepción responde a cada pretensión; si ninguna, escribe "No consta".\n5. Resumen de los cambios o puntos en disputa más relevantes.\nCada fila debe citar entre comillas el fragmento exacto de cada documento con su ubicación (página, numeral o párrafo). Si un tema no aparece en uno de los documentos, escribe "No consta" en esa celda.','DOCUMENTO A\n[Pegue aquí el texto ANONIMIZADO del primer documento]\n\nDOCUMENTO B\n[Pegue aquí el texto ANONIMIZADO del segundo documento]'],
 ['contradicciones','Detectar contradicciones','Actúa como revisor(a) jurídico(a) en derecho administrativo colombiano. Revisa los hechos, pruebas y fundamentos del expediente o escrito que te entrego y detecta inconsistencias.','ESTRUCTURA (presenta una TABLA con columnas: N.º | Tipo | Ubicación textual (cita entre comillas y página/numeral/párrafo) | Descripción | Importancia: alta/media/baja)\n1. Contradicciones internas entre afirmaciones.\n2. Fechas inconsistentes (orden imposible, fechas que no coinciden entre partes del documento).\n3. Hechos sin prueba que los soporte en el documento.\n4. Pruebas aportadas o solicitadas que no se relacionan con ningún hecho.\n5. Fundamentos de derecho que no corresponden a los hechos o pretensiones.\nNo concluyas ni supongas nada que no esté en el documento: describe la inconsistencia y deja la valoración al abogado. Si no encuentras elementos de una categoría, escribe "No se encontraron en el documento".']
];
LM.PROMPTS=P;
function datosProceso(p,anon){ const c=LM.cli(p.clienteId); const nc=x=>v(x)||'No consta'; const cn=anon?'[CLIENTE]':c.nombre;
  const dte=anon&&p.demandante===c.nombre?'[CLIENTE]':(anon?'[DEMANDANTE]':p.demandante);
  const acts=(p.actuaciones||[]).slice().sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,6);
  return 'DATOS DEL PROCESO (registrados en '+LM.state.config.appName+'; verifíquelos contra el expediente)\n- Radicado: '+(anon?'[RADICADO]':nc(LM.fmtRad(p.radicado)))+'\n- Medio de control: '+nc(p.medio)+'\n- Despacho: '+nc(p.despacho)+'\n- Ponente / juez: '+nc(p.ponente)+'\n- Cliente: '+(c.id?cn:'No consta')+'\n- Demandante: '+nc(dte)+'\n- Demandado: '+nc(p.demandado)+'\n- Etapa: '+nc(p.etapa)+'\n- Resumen interno: '+nc(anon?String(p.resumen||'').split(c.nombre).join('[CLIENTE]'):p.resumen)+'\n- Últimas actuaciones registradas:\n'+(acts.map(a=>'  • '+a.fecha+' – '+a.titulo+(a.detalle?': '+a.detalle:'')).join('\n')||'  No consta')+'\n'; }
LM.buildPrompt=function(key,p,opt){ const t=P.find(x=>x[0]===key); opt=opt||{};
  const data=opt.fill&&p?datosProceso(p,opt.anon):'DATOS DEL PROCESO\n- Radicado: [completar]\n- Medio de control: [completar]\n- Despacho: [completar]\n- Partes: [completar]\n- Etapa: [completar]\n';
  return t[2]+'\n\n'+REGLAS+'\n\n'+t[3]+'\n\n'+data+'\n'+(t[4]||'DOCUMENTOS\n[Pegue aquí el texto ANONIMIZADO de la demanda, providencia o documentos pertinentes]')+'\n\nFORMATO DE SALIDA\nTexto en español jurídico formal, con títulos en mayúscula, listo para revisión del abogado. Marca como [VERIFICAR] cualquier afirmación que no esté soportada en los documentos.'; };
function iaView(el,pid,key){ const S=LM.state; key=key||'contestacion';
  el.insertAdjacentHTML('beforeend','<div class="card conf" style="margin-bottom:1rem"><b>🔒 Confidencialidad.</b> <span class="small">Antes de pegar información en una IA externa, anonimice los datos de los clientes (nombres, documentos, direcciones, datos de salud y radicados). El secreto profesional del abogado y la Ley 1581 de 2012 (protección de datos personales) siguen aplicando. Use solo herramientas autorizadas por la firma.</span></div>'+
   '<div class="grid g2" style="align-items:start"><div class="card no-print"><h2>Instrucciones disponibles</h2><div class="list" id="plist">'+P.map(x=>'<button class="btn'+(x[0]===key?' primary':'')+'" data-pk="'+x[0]+'" style="justify-content:flex-start">'+E(x[1])+'</button>').join('')+'</div>'+
   '<label for="ia-p">Proceso</label><select id="ia-p">'+S.procesos.map(p=>'<option value="'+p.id+'"'+(p.id===pid?' selected':'')+'>'+LM.fmtRad(p.radicado).slice(0,24)+' · '+E(p.medio)+'</option>').join('')+'</select>'+
   '<label class="row" style="font-weight:500"><input type="checkbox" id="ia-fill" checked> Rellenar automáticamente con los datos del proceso</label><label class="row" style="font-weight:500"><input type="checkbox" id="ia-anon" checked> Anonimizar cliente y radicado</label></div>'+
   '<div class="card"><div class="row between"><h2 id="ia-t"></h2><button class="btn primary" id="ia-copy">📋 Copiar</button></div><label for="ia-out" class="small muted">Instrucción (editable)</label><textarea id="ia-out" class="prompt-out"></textarea></div></div>');
  const gen=()=>{ const p=LM.proc(el.querySelector('#ia-p').value); el.querySelector('#ia-t').textContent=P.find(x=>x[0]===key)[1]; el.querySelector('#ia-out').value=LM.buildPrompt(key,p,{fill:el.querySelector('#ia-fill').checked,anon:el.querySelector('#ia-anon').checked}); };
  el.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{ key=b.dataset.pk; el.querySelectorAll('[data-pk]').forEach(x=>x.classList.toggle('primary',x===b)); history.replaceState(null,'','#/borradores/'+el.querySelector('#ia-p').value+'/@ia/'+key); gen(); });
  el.querySelectorAll('#ia-p,#ia-fill,#ia-anon').forEach(x=>x.onchange=gen); gen();
  el.querySelector('#ia-copy').onclick=()=>{ const t=el.querySelector('#ia-out'); (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>LM.toast('Instrucción copiada ✓'),()=>{ t.select(); try{document.execCommand('copy');LM.toast('Instrucción copiada ✓');}catch(e){LM.toast('Seleccione y copie manualmente');} }); };
}
function jurisView(el,pid){ const S=LM.state;
  el.insertAdjacentHTML('beforeend','<div class="card no-print" style="margin-bottom:1rem"><label for="jb-p">Proceso</label><select id="jb-p">'+S.procesos.map(p=>'<option value="'+p.id+'"'+(p.id===pid?' selected':'')+'>'+LM.fmtRad(p.radicado).slice(0,24)+' · '+E(p.medio)+' ('+(p.jurisprudencia||[]).length+' fichas)</option>').join('')+'</select><p class="small muted" style="margin-top:.5rem">También disponible en la pestaña «Jurisprudencia» de cada proceso.</p></div><div id="jb"></div>');
  const draw=()=>{ const p=LM.proc(el.querySelector('#jb-p').value); LM.jurisTab(el.querySelector('#jb'),p,draw); };
  el.querySelector('#jb-p').onchange=()=>{ history.replaceState(null,'','#/borradores/'+el.querySelector('#jb-p').value+'/@juris'); draw(); }; draw(); }
const origB=V.borradores;
V.borradores=function(el,args){ const S=LM.state; const pid=args[0]&&LM.proc(args[0])?args[0]:S.procesos[0].id; const mode=args[1]||'';
  const nav='<nav class="subnav no-print" aria-label="Secciones de borradores"><a class="btn sm'+(mode[0]!=='@'?' active':'')+'" href="#/borradores/'+pid+'">📝 Plantillas</a><a class="btn sm'+(mode==='@juris'?' active':'')+'" href="#/borradores/'+pid+'/@juris">📚 Fichas de jurisprudencia</a><a class="btn sm'+(mode==='@ia'?' active':'')+'" href="#/borradores/'+pid+'/@ia">🤖 Instrucciones para IA</a></nav>';
  if(mode==='@juris'){ el.innerHTML='<h1>Fichas de jurisprudencia</h1>'+nav; return jurisView(el,pid); }
  if(mode==='@ia'){ el.innerHTML='<h1>Biblioteca de instrucciones para IA</h1>'+nav+'<p class="small muted">Instrucciones (prompts) listas para copiar en la herramienta de IA que use la firma. Siempre revise el resultado: la IA puede equivocarse.</p>'; return iaView(el,pid,args[2]); }
  origB(el,args); const h=el.querySelector('h1'); h.insertAdjacentHTML('afterend',nav); };

/* ================= PORTAL: PUBLICACIÓN POR PROCESO / ACTUACIÓN ================= */
LM.portalTab=function(tc,p,redraw){ const sh=SH.load(); const acc=sh.accesos.find(a=>a.clienteId===p.clienteId&&a.activo); const c=LM.cli(p.clienteId);
  const acts=p.actuaciones.slice().sort((a,b)=>a.fecha<b.fecha?1:-1);
  tc.innerHTML='<div class="card"><h2>Portal del cliente</h2><p class="small muted">El cliente solo ve lo que usted marque aquí, con el «Resumen para el cliente». Nunca ve notas internas, documentos ni el detalle técnico.</p>'+
   (acc?'<p class="small"><span class="chip ok">Acceso activo</span> '+E(c.nombre)+' ya puede ingresar al portal.</p>':'<p class="small"><span class="chip warn">Sin acceso</span> El cliente aún no tiene código. <a href="#/clientes/'+c.id+'">Generar acceso al portal</a></p>')+
   '<label class="row" style="font-weight:700"><input type="checkbox" id="pp-on"'+(p.publicar?' checked':'')+'> Publicar en portal del cliente</label>'+
   '<label for="pp-res">Resumen para el cliente (lenguaje sencillo)</label><textarea id="pp-res" placeholder="Ej.: Demandamos la decisión de la entidad. El juzgado aceptó estudiar el caso…">'+E(p.resumenCliente||'')+'</textarea></div>'+
   '<h2 style="margin-top:1rem">Actuaciones</h2><div id="pp-acts">'+acts.map(a=>'<div class="pub-act'+(a.publicar?' on':'')+'"><div class="row between"><label class="row" style="margin:0;font-weight:600"><input type="checkbox" data-pa="'+a.id+'"'+(a.publicar?' checked':'')+'> '+E(a.titulo)+'</label><span class="small muted">'+LM.fmt(a.fecha)+'</span></div><label for="pr-'+a.id+'" class="small">Resumen para el cliente</label><textarea id="pr-'+a.id+'" data-pr="'+a.id+'" style="min-height:64px" placeholder="Explique en palabras sencillas qué pasó y si debe hacer algo">'+E(a.resumenCliente||'')+'</textarea></div>').join('')+'</div>'+
   '<div class="row" style="margin-top:.6rem"><button class="btn primary" id="pp-save">💾 Guardar y publicar</button><a class="btn" href="'+LM.sitioURL+'#/portal" target="_blank" rel="noopener">🌐 Ver portal</a></div><p class="small muted" id="pp-msg"></p>';
  tc.querySelector('#pp-save').onclick=()=>{ p.publicar=tc.querySelector('#pp-on').checked; p.resumenCliente=tc.querySelector('#pp-res').value.trim(); let sin=0;
    p.actuaciones.forEach(a=>{ const cb=tc.querySelector('[data-pa="'+a.id+'"]'); if(!cb) return; a.publicar=cb.checked; a.resumenCliente=tc.querySelector('[data-pr="'+a.id+'"]').value.trim(); if(a.publicar&&!a.resumenCliente) sin++; });
    LM.save(); LM.toast(p.publicar?'Publicado en el portal ✓':'Proceso oculto del portal'); redraw(); if(sin) LM.toast(sin+' actuación(es) marcadas sin resumen: no se muestran al cliente'); };
};
/* ================= ACCESO AL PORTAL (Clientes) ================= */
LM.accesoCard=function(c){ const a=SH.load().accesos.find(x=>x.clienteId===c.id&&x.activo);
  return '<div class="card" style="margin-top:1rem" id="accCard"><div class="row between"><h2>🌐 Acceso al portal del cliente</h2>'+(a?'<span class="chip ok">Activo</span>':'<span class="chip">Sin acceso</span>')+'</div>'+
   (a?'<p class="small">Documento: <b>'+E(c.doc)+'</b> · Código: <b class="mono" id="accCode">'+E(a.codigo)+'</b> · creado '+LM.fmt(a.creado)+'</p>':'<p class="small muted">Genere un código para que el cliente consulte sus procesos publicados en el portal con su documento + código.</p>')+
   '<div class="row"><button class="btn primary" id="accGen">🔑 '+(a?'Regenerar':'Generar')+' acceso al portal</button>'+(a?'<button class="btn danger" id="accRev">Revocar</button>':'')+'<a class="btn" href="'+LM.sitioURL+'#/portal" target="_blank" rel="noopener">Abrir portal</a></div><p class="small muted">Demo: el código se guarda en este navegador. En producción se envía por un canal seguro y se guarda cifrado.</p></div>'; };
LM.accesoBind=function(el,c,redraw){ const g=el.querySelector('#accGen'); if(!g) return;
  g.onclick=()=>{ const code=SH.genCode(); SH.update(d=>{ d.accesos.forEach(a=>{ if(a.clienteId===c.id) a.activo=false; }); d.accesos=d.accesos.filter(a=>a.activo); d.accesos.push({clienteId:c.id,docNorm:SH.normDoc(c.doc),codigo:code,creado:LM.iso(LM.today()),activo:true}); });
    LM.save(); redraw(); LM.modal('<h2>Acceso generado ✓</h2><p>Entregue estos datos al cliente por un canal seguro:</p><div class="card"><p>Portal: <b>'+E(new URL(LM.sitioURL+'#/portal',location.href).href)+'</b><br>Documento: <b>'+E(c.doc)+'</b><br>Código de acceso: <b class="mono" style="font-size:1.2rem">'+code+'</b></p></div><p class="small muted">El cliente solo verá los procesos y actuaciones que usted marque como publicados.</p><div class="row" style="justify-content:flex-end"><button class="btn primary" data-close>Listo</button></div>'); };
  const r=el.querySelector('#accRev'); if(r) r.onclick=()=>{ if(!confirm('¿Revocar el acceso al portal de este cliente?')) return; SH.update(d=>{ d.accesos=d.accesos.filter(a=>a.clienteId!==c.id); }); LM.toast('Acceso revocado'); redraw(); }; };

/* ================= SOLICITUDES DEL PORTAL (bandeja) ================= */
const EST={nueva:['Nueva','danger'],en_tramite:['En trámite','warn'],respondida:['Respondida','ok']};
const ORI={contacto:'Formulario de contacto',portal:'Portal del cliente',asistente:'Asistente virtual'};
V.solicitudes=function(el,args){ const S=LM.state; const d=SH.load(); const f=args[0]||'';
  const L=d.solicitudes.filter(s=>!f||s.estado===f); const cnt=k=>d.solicitudes.filter(s=>s.estado===k).length;
  el.innerHTML='<div class="row between"><h1>📨 Solicitudes del portal</h1><a class="btn sm" href="'+LM.sitioURL+'" target="_blank" rel="noopener">🌐 Ver sitio del cliente</a></div><p class="small muted">Consultas que llegan del formulario de contacto del sitio web, del portal del cliente y del asistente virtual. Se actualiza en vivo si el sitio está abierto en otra pestaña de este navegador (demo).</p>'+
   '<div class="subnav"><a class="btn sm'+(f?'':' active')+'" href="#/solicitudes">Todas ('+d.solicitudes.length+')</a>'+Object.entries(EST).map(([k,[t]])=>'<a class="btn sm'+(f===k?' active':'')+'" href="#/solicitudes/'+k+'">'+t+' ('+cnt(k)+')</a>').join('')+'</div><div class="list">'+
   (L.map(s=>{ const c=S.clientes.find(x=>x.id===s.clienteId); const ps=S.procesos.filter(p=>!s.clienteId||p.clienteId===s.clienteId);
    return '<div class="card sol '+s.estado+'" data-sid="'+s.id+'"><div class="row between"><b>'+E(s.asunto||'(sin asunto)')+'</b><span class="chip '+EST[s.estado][1]+'">'+EST[s.estado][0]+'</span></div><div class="small muted">'+E(s.fecha.replace('T',' '))+' · '+E(ORI[s.origen]||s.origen)+' · '+E(s.nombre||(c&&c.nombre)||'—')+(s.email?' · '+E(s.email):'')+(s.tel?' · '+E(s.tel):'')+'</div><p style="white-space:pre-wrap">'+E(s.mensaje)+'</p>'+
     (s.adjuntos&&s.adjuntos.length?'<div class="row small">📎 '+s.adjuntos.map(a=>'<button class="btn sm" data-att="'+a.id+'" data-n="'+E(a.nombre)+'">'+E(a.nombre)+' ('+Math.max(1,Math.round(a.size/1024))+' KB)</button>').join('')+'</div>':'')+
     '<div class="grid g3"><div><label for="sc-'+s.id+'">Cliente</label><select id="sc-'+s.id+'" data-k="clienteId"><option value="">— Sin vincular —</option>'+S.clientes.map(x=>'<option value="'+x.id+'"'+(x.id===s.clienteId?' selected':'')+'>'+E(x.nombre)+'</option>').join('')+'</select></div><div><label for="sp-'+s.id+'">Proceso</label><select id="sp-'+s.id+'" data-k="procesoId"><option value="">— Sin vincular —</option>'+ps.map(p=>'<option value="'+p.id+'"'+(p.id===s.procesoId?' selected':'')+'>'+LM.fmtRad(p.radicado).slice(0,24)+' · '+E(p.medio)+'</option>').join('')+'</select></div><div><label for="se-'+s.id+'">Estado</label><select id="se-'+s.id+'" data-k="estado">'+Object.entries(EST).map(([k,[t]])=>'<option value="'+k+'"'+(k===s.estado?' selected':'')+'>'+t+'</option>').join('')+'</select></div></div>'+
     '<label for="sr-'+s.id+'">Respuesta del abogado (visible para el cliente en el portal)</label><textarea id="sr-'+s.id+'" data-k="respuesta" style="min-height:80px">'+E(s.respuesta||'')+'</textarea>'+(s.respondidaEn?'<p class="small muted">Respondida el '+E(s.respondidaEn.replace('T',' '))+'</p>':'')+
     '<div class="row" style="margin-top:.5rem"><button class="btn primary" data-reply="'+s.id+'">✉ Responder</button><button class="btn" data-savesol="'+s.id+'">Guardar cambios</button>'+(s.procesoId?'<a class="btn sm" href="#/proceso/'+s.procesoId+'">Ver proceso</a>':'')+'</div>'+(s.origen==='contacto'&&!s.clienteId?'<p class="small muted">Sin acceso al portal: la respuesta se envía por correo/teléfono (en la demo solo se guarda).</p>':'')+'</div>'; }).join('')||'<p class="muted">No hay solicitudes en esta vista.</p>')+'</div>';
  const save=(id,reply)=>{ const card=el.querySelector('[data-sid="'+id+'"]'); if(reply&&!card.querySelector('[data-k=respuesta]').value.trim()){ LM.toast('Escriba la respuesta antes de enviarla'); return; } SH.update(dd=>{ const s=dd.solicitudes.find(x=>x.id===id); if(!s) return; card.querySelectorAll('[data-k]').forEach(i=>s[i.dataset.k]=i.value.trim?i.value.trim():i.value);
      if(reply){ s.estado='respondida'; const t=new Date(); s.respondidaEn=LM.iso(t)+'T'+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'); s.leidaCliente=false; }
      else if(s.estado==='respondida'&&!s.respondidaEn&&s.respuesta){ s.respondidaEn=new Date().toISOString().slice(0,16); } });
    LM.toast(reply?'Respuesta enviada al portal ✓':'Solicitud actualizada ✓'); LM.refreshChrome(); V.solicitudes(el,args); };
  el.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>save(b.dataset.reply,true));
  el.querySelectorAll('[data-savesol]').forEach(b=>b.onclick=()=>save(b.dataset.savesol,false));
  el.querySelectorAll('select[data-k=clienteId]').forEach(sel=>sel.onchange=()=>{ const card=sel.closest('[data-sid]'); const ps=S.procesos.filter(p=>!sel.value||p.clienteId===sel.value); card.querySelector('select[data-k=procesoId]').innerHTML='<option value="">— Sin vincular —</option>'+ps.map(p=>'<option value="'+p.id+'">'+LM.fmtRad(p.radicado).slice(0,24)+' · '+E(p.medio)+'</option>').join(''); });
  el.querySelectorAll('[data-att]').forEach(b=>b.onclick=async()=>{ try{ const blob=await SH.fileGet(b.dataset.att); if(!blob) return LM.toast('Archivo no disponible en este navegador'); LM.download(b.dataset.n,blob); }catch(e){ LM.toast('No se pudo abrir'); } });
};
const origA=V.alertas; V.alertas=function(el,args){ origA(el,args); const n=SH.countNuevas(); if(n){ const h=el.querySelector('h1'); h&&h.insertAdjacentHTML('afterend','<a class="card item row between" href="#/solicitudes/nueva" style="margin:.5rem 0"><span>📨 Tiene <b>'+n+'</b> solicitud'+(n>1?'es':'')+' nueva'+(n>1?'s':'')+' del portal</span><span class="btn sm primary">Ver bandeja</span></a>'); } };
})();

</script>
<script>LM.boot();</script>
</body>
</html>
